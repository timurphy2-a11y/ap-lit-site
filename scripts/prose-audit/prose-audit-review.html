epends on a sightline the viewer has to work out. The Rococo picture asks to be enjoyed. This one asks to be understood, and then obeyed.", "spanInContext": [402, 415]}, {"id": "3_Enlightenment_Painting.md:24:R17-passive:8", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 24, "flagged": "is seen", "context": "Austen's world is precisely this: a world of rooms, assemblies, drawing-room conversations, and garden walks in which the arrangement of people in space carries social meaning. Who sits next to whom at dinner, who is seen speaking to whom at the Netherfield ball — these spatial arrangements constitute the novel's action. Her characters are also named by their land, exactly as Gainsborough's sitters are framed by theirs: Darcy *of Pemberley*, the Bingleys renting Netherfield, the Bennets' entailed Longbourn.", "spanInContext": [214, 221]}, {"id": "3_Enlightenment_Painting.md:24:R17-passive:9", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 24, "flagged": "are framed", "context": "Austen's world is precisely this: a world of rooms, assemblies, drawing-room conversations, and garden walks in which the arrangement of people in space carries social meaning. Who sits next to whom at dinner, who is seen speaking to whom at the Netherfield ball — these spatial arrangements constitute the novel's action. Her characters are also named by their land, exactly as Gainsborough's sitters are framed by theirs: Darcy *of Pemberley*, the Bingleys renting Netherfield, the Bennets' entailed Longbourn.", "spanInContext": [402, 412]}, {"id": "3_Enlightenment_Painting.md:86:R17-passive:10", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The Death of Marat, Jacques-Louis Davi", "line": 86, "flagged": "is arranged", "context": "**Analysis:** Marat, a revolutionary journalist, was stabbed in his medicinal bath by Charlotte Corday; David, his friend and fellow revolutionary, painted this within months and hung it in the National Convention. Everything is arranged like the instruments of a Passion — the wound, the knife on the floor, the quill still in the hand, the packing-crate desk inscribed with David's dedication. The pose is a *pietà* with the mourners removed. And the top half of the canvas is nothing at all: a bare, dark, empty ground where a Baroque painter would have put an opening heaven. The revolution had abolished heaven, so David left the space blank.", "spanInContext": [226, 237]}, {"id": "3_Enlightenment_Painting.md:101:R17-passive:11", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The Pilgrimage to Cythera, Jean-Antoin", "line": 101, "flagged": "is defined", "context": "### Gallery — The Pilgrimage to Cythera, Jean-Antoine Watteau, 1717\nRead the painting as a sequence of couples strung across an idealized garden, staged like figures at a country assembly. The composition curves gently from the lovers still seated at right to those already drifting toward the boat at left. Everyone is defined by their pairing and their place in the social choreography — but look closely and the mood is wistful: they are *leaving* the island of love, not arriving, and that undertow of melancholy beneath the charm is precisely what anticipates Austen's irony.", "spanInContext": [317, 327]}, {"id": "3_Enlightenment_Painting.md:106:R17-passive:12", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The Secret Message, François Boucher, ", "line": 106, "flagged": "is treated", "context": "### Gallery — The Secret Message, François Boucher, 1767\nLook at how the paint renders silk, lace, foliage, and skin — fluid, light, decorative, with no visible struggle in the brushwork. An intimate domestic moment (a whispered message between two women in a garden) is treated with the same jewel-like refinement Boucher gave to mythological scenes. The effect of naturalness is achieved through extraordinary artifice; the ease is the performance.", "spanInContext": [268, 278]}]}, {"file": "3_Enlightenment_Philosophy.md", "words": 2696, "findings": [{"id": "3_Enlightenment_Philosophy.md:38:not-just:0", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Connection to *Pride and Prejudice*", "line": 38, "flagged": "not just the correction of a factual error, but", "context": "Elizabeth's journey is the novel's great test case. She prides herself on her perceptiveness, her ability to see through appearances and judge character accurately. Yet her judgment of Darcy in the first half of the novel is fundamentally shaped by *amour-propre*: she liked Wickham because he flattered her, and she disliked Darcy because he wounded her pride. The moment she recognizes this —                                        — is the moment that she finally consults her impartial spectator honestly. It is an Enlightenment awakening: not just the correction of a factual error, but the discovery that her own moral perception has been distorted by the very social self-consciousness Rousseau diagnosed. Austen's genius is to show that this distortion is not a permanent condition. Elizabeth and Darcy can both learn to see each other (and themselves) more clearly. The impartial spectator can be cultivated, but the cultivation requires exactly the kind of courage that Kant calls for with his \"dare to know.\"", "spanInContext": [544, 591]}, {"id": "3_Enlightenment_Philosophy.md:56:not-just:1", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Connection to *Pride and Prejudice*", "line": 56, "flagged": "not just intelligence but", "context": "The novel is a sustained exploration of how intelligent people go wrong in their judgments, and how they can learn to follow the right path. Elizabeth trusts first impressions and the evidence of surfaces; Darcy trusts social categories and inherited assumptions. The novel insists that moral knowledge — real knowledge of other people and of yourself — requires not just intelligence but something closer to what Smith describes: the patient, honest exercise of sympathetic imagination, disciplined by the willingness to revise your conclusions when the evidence demands it. Elizabeth is brilliant, but brilliance is not enough. She must learn to see past the distortions of her own *amour-propre*, and that requires not more reason but a different, more honest way of using it.", "spanInContext": [363, 388]}, {"id": "3_Enlightenment_Philosophy.md:56:R8-second-person:2", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 56, "flagged": "yourself", "context": "The novel is a sustained exploration of how intelligent people go wrong in their judgments, and how they can learn to follow the right path. Elizabeth trusts first impressions and the evidence of surfaces; Darcy trusts social categories and inherited assumptions. The novel insists that moral knowledge — real knowledge of other people and of yourself — requires not just intelligence but something closer to what Smith describes: the patient, honest exercise of sympathetic imagination, disciplined by the willingness to revise your conclusions when the evidence demands it. Elizabeth is brilliant, but brilliance is not enough. She must learn to see past the distortions of her own *amour-propre*, and that requires not more reason but a different, more honest way of using it.", "spanInContext": [343, 351]}, {"id": "3_Enlightenment_Philosophy.md:56:R8-second-person:3", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 56, "flagged": "your", "context": "The novel is a sustained exploration of how intelligent people go wrong in their judgments, and how they can learn to follow the right path. Elizabeth trusts first impressions and the evidence of surfaces; Darcy trusts social categories and inherited assumptions. The novel insists that moral knowledge — real knowledge of other people and of yourself — requires not just intelligence but something closer to what Smith describes: the patient, honest exercise of sympathetic imagination, disciplined by the willingness to revise your conclusions when the evidence demands it. Elizabeth is brilliant, but brilliance is not enough. She must learn to see past the distortions of her own *amour-propre*, and that requires not more reason but a different, more honest way of using it.", "spanInContext": [529, 533]}, {"id": "3_Enlightenment_Philosophy.md:52:R17-passive:4", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Knowledge and Its Limits", "line": 52, "flagged": "is designed", "context": "Voltaire makes a related argument through satire rather than philosophy. *Candide* (1759) follows an incurably optimistic young man through a cascade of disasters — the Lisbon earthquake, the Inquisition, slavery in Suriname — each of which his tutor Pangloss explains away with the Leibnizian formula that we live in the                                The joke is devastating: the system survives every refutation because it is designed to be irrefutable. *Candide* presents an argument about the limits of abstract reasoning when it insulates itself from experience; the rational system that explains everything explains nothing, because it cannot be falsified by anything that actually happens. Voltaire's remedy (                              ) is deliberately, stubbornly modest. What can redeem                        of human suffering is not a new philosophical system, but the abandonment of system in favor of immediate, practical work to alleviate pain and instantiate happiness in the people around us.", "spanInContext": [426, 437]}, {"id": "3_Enlightenment_Philosophy.md:36:R22-flat-interpretive:5", "rule": "R22", "name": "Interpretive claim stated as fact", "tier": "low", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 36, "flagged": "Austen's novel is a laboratory", "context": "Austen's novel is a laboratory for testing Rousseau's diagnosis and Smith's remedy. Every character in the book is somehow caught in the web of *amour-propre* — performing, comparing, judging, and being judged. Mrs. Bennet's obsession with advantageous marriages is *amour-propre* at its most anxious. Wickham's charm is a masterclass in managing appearances. In his character, being and appearing have split entirely apart; his polished social performance conceals a morally vacant core. Darcy's pride is *amour-propre* in its aristocratic form; his sense of his own worth is inseparable from his consciousness of his social rank relative to others, at least at the beginning of his arc as a character.", "spanInContext": [0, 30]}]}, {"file": "3_Enlightenment_Sculpture.md", "words": 2237, "findings": [{"id": "3_Enlightenment_Sculpture.md:8:R2-hedging:2", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Introduction", "line": 8, "flagged": "a kind of", "context": "The presiding genius of this development is Jean-Antoine Houdon, whose portrait busts of Voltaire, Franklin, Jefferson, Washington, and Rousseau constitute a kind of sculptural encyclopedia of Enlightenment thought. Houdon did not merely reproduce likenesses; he produced character studies — faces in which one can read the quality of the mind within.", "spanInContext": [156, 165]}, {"id": "3_Enlightenment_Sculpture.md:34:R2-hedging:3", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Material & Making", "line": 34, "flagged": "in a sense", "context": "Canova absorbed the argument completely. His marbles are worked to a finish that makes Bernini's illusionistic virtuosity look almost rough by comparison — surfaces so smooth they seem lit from within, forms so idealized they suggest that the sculptor's task is to reveal an ideal already present in the stone. Unlike most sculptors of his scale, who ran large workshops and handed the final surface to assistants, Canova insisted on doing the finishing himself; the polish comes from his own hands. The ambition is not marble pretending to be flesh, the Baroque approach, but marble achieving a beauty that transcends the distinction between stone and skin — an inheritance, in a sense, from his countryman Bernini a century and a half earlier. On his *Pauline Bonaparte as Venus Victrix* the carved mattress and cushion are so convincingly soft that for decades visitors reached across the rope to squeeze one corner, until a restoration cleaned off the accumulated fingerprints and the barrier was moved back.", "spanInContext": [676, 686]}, {"id": "3_Enlightenment_Sculpture.md:46:R8-second-person:4", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Space & Setting", "line": 46, "flagged": "your", "context": "Houdon's busts went everywhere that Enlightenment thought traveled. Voltaire's likeness presided over the Comédie-Française; terracotta versions circulated among salons and libraries across Europe. Jefferson commissioned the life-size standing *Washington* for the Virginia State Capitol — the first such civic monument in the new republic, and a deliberate argument that the American experiment was the heir to classical republican virtue. Franklin and Rousseau were similarly multiplied and distributed. To own a Houdon bust was to announce your intellectual commitments, to align yourself publicly with the values of reason and rational governance.", "spanInContext": [543, 547]}, {"id": "3_Enlightenment_Sculpture.md:46:R8-second-person:5", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Space & Setting", "line": 46, "flagged": "yourself", "context": "Houdon's busts went everywhere that Enlightenment thought traveled. Voltaire's likeness presided over the Comédie-Française; terracotta versions circulated among salons and libraries across Europe. Jefferson commissioned the life-size standing *Washington* for the Virginia State Capitol — the first such civic monument in the new republic, and a deliberate argument that the American experiment was the heir to classical republican virtue. Franklin and Rousseau were similarly multiplied and distributed. To own a Houdon bust was to announce your intellectual commitments, to align yourself publicly with the values of reason and rational governance.", "spanInContext": [583, 591]}, {"id": "3_Enlightenment_Sculpture.md:78:is-the-entire:0", "rule": "—", "name": "“Is the entire …”", "tier": "medium", "layer": "A", "section": "Gallery — Psyche Revived by Cupid's Kiss, Antoni", "line": 78, "flagged": "is the entire Neoclassical", "context": "**Analysis:** Start with the names, because the subject choice is the argument. *Psyche* is the Greek word for the soul or the mind; *Eros* is desire. A sculpture in which the mind is revived by passion — and held, steadied, lifted into a controlled diagonal — is the entire Neoclassical programme in two figures: feeling is necessary, and feeling must answer to reason. Then look at how little the bodies betray of individual identity. These are not portraits but perfected types. The composition is built on a gentle diagonal, Cupid's wings and arms forming a frame that draws Psyche's reviving body up into his kiss, and the marble is polished until it seems to become skin.", "spanInContext": [261, 287]}, {"id": "3_Enlightenment_Sculpture.md:6:stranded-auxiliary:1", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Introduction", "line": 6, "flagged": ", because contemporaries did.", "context": "This page sits at the opposite pole from the painting page, and the distance is the century's actual intellectual content. The Rococo shown there was the aristocratic world's last confection; Neoclassicism, shown here, arrived as its deliberate repudiation — sober, archaeological, civic, and eventually revolutionary. A student moving between the two pages should feel the whiplash, because contemporaries did.", "spanInContext": [382, 411]}, {"id": "3_Enlightenment_Sculpture.md:24:R18-weak-ending:6", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 24, "flagged": "and character will reveal itself", "context": "Austen's novel is organized around the problem of reading faces — whether surface manner reliably reveals inner character. Wickham's is the face that performs perfectly: handsome, open, agreeable, he produces exactly the impression he intends. Darcy's face is unreadable in a different way. His expression, which Elizabeth reads as proud contempt, turns out to conceal a complex emotional life. The novel's great question is whether the Enlightenment premise that careful, rational observation of surfaces yields reliable knowledge of what lies beneath holds up in the social world. Houdon's portrait busts argue that a social observer can study the face long enough, with enough honest attention, and character will reveal itself.", "spanInContext": [698, 730]}, {"id": "3_Enlightenment_Sculpture.md:44:R18-weak-ending:7", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 44, "flagged": "and how does placement shape meaning", "context": "*Where does the sculpture live, and how does placement shape meaning?*", "spanInContext": [32, 68]}, {"id": "3_Enlightenment_Sculpture.md:80:R18-weak-ending:8", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Gallery — Psyche Revived by Cupid's Kiss, Antoni", "line": 80, "flagged": "this is the same technical miracle asked to behave itself", "context": "**Prompt:** Compared to Bernini's writhing Daphne, this is the same technical miracle asked to behave itself.", "spanInContext": [51, 108]}, {"id": "3_Enlightenment_Sculpture.md:16:R17-passive:9", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Body & Volume", "line": 16, "flagged": "are rendered", "context": "The Enlightenment body in sculpture is disciplined and controlled — neither the medieval figure's subordination to theological program nor the Baroque figure's explosion into physical crisis, but something more measured and socially legible. Houdon's portrait subjects are rendered with remarkable specificity: the loose skin at Voltaire's throat, the sharp alertness of his eyes, the slight forward inclination of the body that suggests a mind perpetually engaged. This is naturalism in the service of character revelation. Accuracy is conveyed not as an end in itself but as a way of making the inner life visible on the outer surface.", "spanInContext": [269, 281]}, {"id": "3_Enlightenment_Sculpture.md:18:R17-passive:10", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Body & Volume", "line": 18, "flagged": "be seen", "context": "Canova's approach is the counterpoint. His *Psyche Revived by Cupid's Kiss* achieves a surface so refined, so smoothly idealized, that it seems to transcend individual bodies altogether. These are not particular people but perfected forms, the classical ideal recovered and polished to an impossible smoothness. Where Houdon insists on the individual, Canova insists on the type. Both are Enlightenment gestures: one says that the particular rational individual deserves to be seen clearly; the other says that beauty, like reason, tends toward the universal and the ideal.", "spanInContext": [474, 481]}]}, {"file": "4_Romantic_Music.md", "words": 1346, "findings": [{"id": "4_Romantic_Music.md:46:R2-hedging:2", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "What to Listen For", "line": 46, "flagged": "a kind of", "context": "Debussy's *La Mer* sits at the boundary between Romanticism and Modernism: the orchestra creates shifting, shimmering textures that evoke the sea not through representation but with a kind of sonic impressionism. The connection to Melville's ocean is almost too perfect; this is the sound of \"meditation and water\" wedded together.", "spanInContext": [182, 191]}, {"id": "4_Romantic_Music.md:40:the-entire-is:0", "rule": "—", "name": "“The entire … is”", "tier": "medium", "layer": "A", "section": "What to Listen For", "line": 40, "flagged": "the entire movement is", "context": "In the first movement of Beethoven's Fifth above, the famous four-note motif is not just a catchy opening phrase; it is the raw material from which the entire movement is built. Listen for the way that those four notes are fragmented, transposed, extended, and combined as the movement unfolds. The relentless developmental energy is what makes this transitional piece Romantic rather than Classical. Classical sonata form is still the skeleton, but the flesh is Romantic intensity.", "spanInContext": [148, 170]}, {"id": "4_Romantic_Music.md:54:sentence-anaphora:1", "rule": "R20", "name": "Repeated sentence openers", "tier": "medium", "layer": "A", "section": "Looking Forward", "line": 54, "flagged": "Where Romantic music stretched the tonal system to its limits, Schoenberg will abandon it entirely. Where Romantic composers expanded inherited forms, Stravinsky will shatter them. Where Romantic texture was lush and immersive, Modernist texture will be fragmented and deliberately strange.", "context": "Modernism will complete the revolution that Romanticism began. Where Romantic music stretched the tonal system to its limits, Schoenberg will abandon it entirely. Where Romantic composers expanded inherited forms, Stravinsky will shatter them. Where Romantic texture was lush and immersive, Modernist texture will be fragmented and deliberately strange. European Romantic music drew on folk traditions and nationalist feeling, but Modernism in America will be transformed by the African American musical traditions (jazz, the blues, and their descendants) that directly shaped Ellison's *Invisible Man*.", "spanInContext": [63, 353]}]}, {"file": "4_Romantic_Philosophy.md", "words": 1216, "findings": [{"id": "4_Romantic_Philosophy.md:32:not-just:1", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Knowledge and Its Limits", "line": 32, "flagged": "This is not anti-rational; it is", "context": "Emerson makes a parallel argument about nature itself. The problem is that                                     We look at the landscape and see property lines, economic value, familiar objects. The poet or the child, a person whose                                                                     sees something else: the living unity beneath the surfaces, the                                                  This is not anti-rational; it is a claim that rationality, operating alone, produces a diminished picture of the world.", "spanInContext": [413, 445]}, {"id": "4_Romantic_Philosophy.md:18:R2-hedging:2", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "The Human Position", "line": 18, "flagged": "a kind of", "context": "Emerson's *Nature* takes this individualistic turn and projects it outward, onto the American landscape. Standing on bare ground, his head                                                               Emerson experiences a dissolution of the boundary between self and world:                                                             This is the Romantic sublime, the experience of being overwhelmed by something so vast that the ordinary self disappears, replaced by a kind of ecstatic unity with nature.", "spanInContext": [469, 478]}, {"id": "4_Romantic_Philosophy.md:28:R8-second-person:3", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Knowledge and Its Limits", "line": 28, "flagged": "you", "context": "The Romantic answer is not that reason is useless, but that reason alone is radically insufficient. Shelley's *Defence of Poetry* makes the case with precision:                                                                                                                                                                                                                                    Reason shows you what something is made of; imagination helps you apprehend why and how it is meaningful.", "spanInContext": [401, 404]}, {"id": "4_Romantic_Philosophy.md:28:R8-second-person:4", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Knowledge and Its Limits", "line": 28, "flagged": "you", "context": "The Romantic answer is not that reason is useless, but that reason alone is radically insufficient. Shelley's *Defence of Poetry* makes the case with precision:                                                                                                                                                                                                                                    Reason shows you what something is made of; imagination helps you apprehend why and how it is meaningful.", "spanInContext": [450, 453]}, {"id": "4_Romantic_Philosophy.md:54:stacked-questions:0", "rule": "R35", "name": "Stacked rhetorical questions", "tier": "medium", "layer": "A", "section": "Looking Back, Looking Forward", "line": 54, "flagged": "What happens to the Romantic self when it encounters not the white whale but the trenches of the Western Front? What happens to imagination when Freud's unconscious turns out to be not a wellspring of visionary truth but a tangle of repressed desires and childhood wounds?", "context": "**Toward Modernism:** The Romantics' faith in the individual imagination, the visionary artist, and the sublime encounter with nature will be severely tested by the catastrophes of the twentieth century. What happens to the Romantic self when it encounters not the white whale but the trenches of the Western Front? What happens to imagination when Freud's unconscious turns out to be not a wellspring of visionary truth but a tangle of repressed desires and childhood wounds? Modernism inherits Romanticism's intensity but loses its confidence. Ellison's invisible man is a Romantic individual — unique, perceptive, passionately alive — trapped in a world that has no category for him.", "spanInContext": [204, 476]}, {"id": "4_Romantic_Philosophy.md:28:R17-passive:5", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Knowledge and Its Limits", "line": 28, "flagged": "is made", "context": "The Romantic answer is not that reason is useless, but that reason alone is radically insufficient. Shelley's *Defence of Poetry* makes the case with precision:                                                                                                                                                                                                                                    Reason shows you what something is made of; imagination helps you apprehend why and how it is meaningful.", "spanInContext": [420, 427]}, {"id": "4_Romantic_Philosophy.md:36:R22-flat-interpretive:6", "rule": "R22", "name": "Interpretive claim stated as fact", "tier": "low", "layer": "B", "section": "Connection to *Moby-Dick*", "line": 36, "flagged": "the novel is an encyclopedia", "context": "Among many other things, the novel is an encyclopedia of whaling, cetology, and maritime law. Ishmael compulsively classifies, measures, and analyzes. Yet the whale escapes every system of classification. The whiteness of the whale (the subject of one of the novel's most famous chapters) resists interpretation: it can signify purity or terror, the divine or the void, everything or nothing. Melville dramatizes the Romantic epistemological crisis; knowledge proliferates, but meaning recedes. The more Ishmael knows about whales, the less he understands about the significance of *this* whale. Categorizing reason has reached its limit; what lies beyond is the territory of the sublime.", "spanInContext": [25, 53]}]}, {"file": "5_Modernism_Music.md", "words": 1455, "findings": [{"id": "5_Modernism_Music.md:52:ai-vocab:3", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Looking Back", "line": 52, "flagged": "interplay", "context": "The full arc of the course is audible from here. Medieval monophony — a single voice, no harmony, no tension — gave way to Renaissance polyphony's balanced interplay of equal voices. Baroque music charged that polyphony with dramatic contrast. Classical music refined contrast into elegant architecture. Romanticism stretched that architecture to the breaking point. And Modernism breaks it apart entirely — the tonal system, the balanced phrases, the unified texture, the promise of resolution — revealing that every previous musical language was itself a set of conventions, not a description of nature. Jazz, emerging from a different tradition entirely, offers an alternative model: structure and freedom held in a productive, improvisatory tension. Ellison's *Invisible Man* draws on both the European rupture and the African American innovation, creating a novel that is itself a new kind of music.", "spanInContext": [156, 165]}, {"id": "5_Modernism_Music.md:46:R2-hedging:4", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "What to Listen For", "line": 46, "flagged": "in a way", "context": "In Ellington's *Black, Brown and Beige*, listen for how jazz texture works at the level of the ensemble: individual soloists emerge from the collective, improvise, and return. The relationship between soloist and ensemble is fluid and democratic in a way that neither Classical homophony nor Baroque counterpoint achieves. It is this texture, more than any European formal innovation, that Ellison drew on as a model for his narrator's voice.", "spanInContext": [246, 254]}, {"id": "5_Modernism_Music.md:22:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Consonance & Dissonance", "line": 22, "flagged": "no home, no hierarchy, no resolution", "context": "Schoenberg explicitly described his musical project as the **emancipation of dissonance**. In the tonal system, certain notes are \"home\" and others create tension that pulls toward home; consonance and dissonance are a hierarchy, with resolution always implied. Schoenberg sought to eliminate that hierarchy entirely. Between 1908 and 1913, in works including *Pierrot Lunaire*, he suspended the rules of traditional tonal harmony in favor of melody, polyphony, and motivic development — a freely atonal style in which all twelve notes of the chromatic scale are treated as equals. There is no home, no hierarchy, no resolution. The effect is music that sounds permanently unanchored, floating in a space where tension never resolves because there is no longer any stable ground to sonically define resolution. Schoenberg saw himself not as a revolutionary but as the next inevitable step in the German tradition that ran from Bach through Beethoven and Brahms to Wagner and Mahler — each generation having pushed the tonal system further until Schoenberg simply completed the trajectory.", "spanInContext": [591, 627]}, {"id": "5_Modernism_Music.md:48:no-chain:1", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "What to Listen For", "line": 48, "flagged": "no tonal center, no resolution", "context": "In Schoenberg's *Pierrot Lunaire* below, the vocalist's **Sprechstimme** (a technique suspended between speaking and singing) makes language itself sound fragmented and uncanny. There is no tonal center, no resolution. The feeling is of floating in darkness — the sonic equivalent of the narrator's underground room before the lights come on.", "spanInContext": [187, 217]}, {"id": "5_Modernism_Music.md:52:no-chain:2", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Looking Back", "line": 52, "flagged": "no harmony, no tension", "context": "The full arc of the course is audible from here. Medieval monophony — a single voice, no harmony, no tension — gave way to Renaissance polyphony's balanced interplay of equal voices. Baroque music charged that polyphony with dramatic contrast. Classical music refined contrast into elegant architecture. Romanticism stretched that architecture to the breaking point. And Modernism breaks it apart entirely — the tonal system, the balanced phrases, the unified texture, the promise of resolution — revealing that every previous musical language was itself a set of conventions, not a description of nature. Jazz, emerging from a different tradition entirely, offers an alternative model: structure and freedom held in a productive, improvisatory tension. Ellison's *Invisible Man* draws on both the European rupture and the African American innovation, creating a novel that is itself a new kind of music.", "spanInContext": [86, 108]}, {"id": "5_Modernism_Music.md:16:R18-weak-ending:5", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Connection to *Invisible Man*", "line": 16, "flagged": "and the rapid shifts between them are part of the novel's meaning", "context": "Ellison explicitly modeled *Invisible Man* on jazz: the narrator's voice riffs, improvises, circles back, and breaks into different registers — sermon, speech, blues lyric, philosophical meditation — just as a jazz soloist moves through different modes of expression within a single performance. The novel's texture is layered, shifting, and sometimes deliberately dissonant, voices and registers colliding rather than blending. The Brotherhood rally, the Liberty Paints factory, the Harlem riot, the underground epilogue — each section has a different sonic texture, and the rapid shifts between them are part of the novel's meaning.", "spanInContext": [568, 633]}, {"id": "5_Modernism_Music.md:4:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Introduction", "line": 4, "flagged": "is defined", "context": "Musical Modernism, like its counterparts in painting and literature, is defined by rupture, but the rupture did not arrive without warning. The tonal system that had organized Western music for centuries was already under extreme pressure by the late nineteenth century. Wagner needed to do the technically \"wrong thing\" — suspending harmonic resolution, violating tonal expectation — to achieve the expressive effects he needed. Mahler pushed further still. Each generation of Romantic composers required more extreme musical means to express more extreme emotional states. Schoenberg, Stravinsky, and their contemporaries were not so much revolutionaries as the inevitable next step: composers for whom the inherited language had finally, definitively become exhausted. Just as Cubism shattered the coherent picture plane and Ellison fragmented the unified narrative voice, they broke apart the fundamental assumptions of the tonal harmonic system.", "spanInContext": [69, 79]}, {"id": "5_Modernism_Music.md:12:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Texture & Voices", "line": 12, "flagged": "be used", "context": "Modernist composers fragment, layer, and juxtapose textures in ways that would have been unthinkable in earlier eras. The foundation was laid by Debussy, who approached the orchestra not as a blended collective but as a large chamber ensemble of individuals, voices that could be used singly or in any combination, sparingly or grandly, as the music demanded. Timbre became, for Debussy, a thematic element in its own right, as structurally significant as melody or harmony. Stravinsky inherited this atomized approach to orchestral color and then transformed with it: rather than Debussy's shimmering, static clouds of sound, he stacked those individual voices into percussive rhythmic webs, creating a sense of collision rather than atmosphere. Schoenberg, meanwhile, stripped the ensemble down to small, unusual combinations — a flute, a bass clarinet, a piano, a reciting voice — that sound deliberately strange and exposed. In American jazz, improvisation creates a texture where individual voices emerge from and return to the ensemble in fluid, unpredictable ways.", "spanInContext": [277, 284]}, {"id": "5_Modernism_Music.md:22:R17-passive:8", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Consonance & Dissonance", "line": 22, "flagged": "are treated", "context": "Schoenberg explicitly described his musical project as the **emancipation of dissonance**. In the tonal system, certain notes are \"home\" and others create tension that pulls toward home; consonance and dissonance are a hierarchy, with resolution always implied. Schoenberg sought to eliminate that hierarchy entirely. Between 1908 and 1913, in works including *Pierrot Lunaire*, he suspended the rules of traditional tonal harmony in favor of melody, polyphony, and motivic development — a freely atonal style in which all twelve notes of the chromatic scale are treated as equals. There is no home, no hierarchy, no resolution. The effect is music that sounds permanently unanchored, floating in a space where tension never resolves because there is no longer any stable ground to sonically define resolution. Schoenberg saw himself not as a revolutionary but as the next inevitable step in the German tradition that ran from Bach through Beethoven and Brahms to Wagner and Mahler — each generation having pushed the tonal system further until Schoenberg simply completed the trajectory.", "spanInContext": [559, 570]}]}, {"file": "5_Modernism_Painting.md", "words": 3145, "findings": [{"id": "5_Modernism_Painting.md:22:not-just:5", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Connection to *Invisible Man*", "line": 22, "flagged": "not merely a social observation but", "context": "Ellison's narrator cannot be seen whole by the society around him. This is not merely a social observation but a formal principle: the novel itself fragments its protagonist across multiple identities, roles, and perspectives — college student, factory worker, Brotherhood orator, underground man — none of which adds up to a complete, coherent self visible from a single vantage point. This is Cubism applied to character. Just as Picasso's figures are seen from everywhere and nowhere simultaneously, Ellison's narrator is defined by the multiple, contradictory ways others see him (or refuse to see him). The \"invisibility\" of the title is not merely a metaphor for racism but a formal condition, the condition of a self that cannot be unified because the social space it inhabits is itself fractured and incoherent.", "spanInContext": [75, 110]}, {"id": "5_Modernism_Painting.md:22:not-just:6", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Connection to *Invisible Man*", "line": 22, "flagged": "not merely a metaphor for racism but", "context": "Ellison's narrator cannot be seen whole by the society around him. This is not merely a social observation but a formal principle: the novel itself fragments its protagonist across multiple identities, roles, and perspectives — college student, factory worker, Brotherhood orator, underground man — none of which adds up to a complete, coherent self visible from a single vantage point. This is Cubism applied to character. Just as Picasso's figures are seen from everywhere and nowhere simultaneously, Ellison's narrator is defined by the multiple, contradictory ways others see him (or refuse to see him). The \"invisibility\" of the title is not merely a metaphor for racism but a formal condition, the condition of a self that cannot be unified because the social space it inhabits is itself fractured and incoherent.", "spanInContext": [643, 679]}, {"id": "5_Modernism_Painting.md:32:R2-hedging:7", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Light & Shadow", "line": 32, "flagged": "somewhat", "context": "The more radical step is to paint light with no source at all. The two abstract artists here who take it describe what they are doing not as a retreat from reality but as a revelation of a deeper realism, a pictorial means of communicating emotion, consciousness, and spirit. Hilma af Klint reached that position first, working from 1906 inside a spiritualist practice she kept out of public view. Kandinsky reached it independently around 1912–13, then wrote a book about it, exhibited it, and taught it, ultimately achieving greater (and somewhat unjustified) acclaim as the pioneer of abstraction.", "spanInContext": [540, 548]}, {"id": "5_Modernism_Painting.md:46:R2-hedging:8", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Brushwork & Surface", "line": 46, "flagged": "a kind of", "context": "In many of its iterations, Modernism openly embraces the reality that a painting is a flat surface covered with paint, and pretending otherwise is a kind of willful self-deception. The surface of the painting becomes the subject. Rembrandt had hinted at it and Manet forced it into the open; Van Gogh made it impossible to ignore. His brushstrokes are thick, visible, and directional, laid down with an urgency that has nothing to do with accurately describing a cypress tree or a starlit sky and everything to do with recording the hand that made them.", "spanInContext": [147, 156]}, {"id": "5_Modernism_Painting.md:16:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Figure & Space", "line": 16, "flagged": "no longer whole, no longer occupying a coherent space", "context": "The unified, rational space of the Renaissance is progressively shattered by the development of Modern painting. Manet — working two decades before this unit's own period begins, but already unsettling the single coherent viewpoint the Renaissance had established — flattened his figures, eliminating the smooth tonal modeling that gave bodies their three-dimensional illusion, and built the *Bar at the Folies-Bergère* around a reflection that cannot be reconciled with the woman casting it. Cézanne pushed further: rather than record a scene from one fixed position, he painted objects and figures as planes of color seen from several slightly different angles at once, arguing in effect that no single vantage point is more valid or true than another. Picasso saw a large Cézanne retrospective in 1907, months before finishing his own *Demoiselles*, and Georges Braque built early Cubism directly out of Cézanne's faceted landscapes. Cézanne is routinely called the movement's father; Cubism pursues his fracturing of form to its logical conclusion. Picasso and Braque broke figures and objects into shards, showing multiple viewpoints at once on a single flat surface. The figure is no longer whole, no longer occupying a coherent space. It is fragmented, reassembled, sometimes unrecognizable.", "spanInContext": [1187, 1240]}, {"id": "5_Modernism_Painting.md:98:no-chain:1", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Gallery — Water Lilies (triptych), Claude Monet,", "line": 98, "flagged": "no horizon anywhere in it — no bank, no sky above the water, no edge to stand on", "context": "**Analysis:** Forty-one feet of pond across three panels, and no horizon anywhere in it — no bank, no sky above the water, no edge to stand on. Monet painted these in a purpose-built studio at Giverny during the First World War, close enough to the front to hear the guns, and pledged the great cycle to France the day after the Armistice as a monument to peace. Then they were largely forgotten. For roughly two decades after his death the late panels were dismissed as an old man's decorative excess, some of them left in the studio. What changed was not the paintings but the people looking: by the 1950s the scale and edge-to-edge composition of Abstract Expressionist canvases had made Monet's suddenly legible, and MoMA became the first American museum to buy one. Pollock is the reason we can see this.", "spanInContext": [62, 142]}, {"id": "5_Modernism_Painting.md:100:no-chain:2", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Gallery — Water Lilies (triptych), Claude Monet,", "line": 100, "flagged": "no bank, no horizon, and no edge", "context": "**Prompt:** Try to work out where you are standing in relation to this water. You can't — there is no bank, no horizon, and no edge, which is exactly what took forty years to be read as a strength rather than a failure.", "spanInContext": [99, 131]}, {"id": "5_Modernism_Painting.md:130:no-chain:3", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Gallery — The Dance, Henri Matisse, 1910", "line": 130, "flagged": "no modeling, no measurable space, no anatomical detail beyond what the movement requires", "context": "**Analysis:** Five figures circle in a ring against nothing but a band of blue and a band of green — no modeling, no measurable space, no anatomical detail beyond what the movement requires. Matisse painted a full-scale first version the year before, softer and pink-toned; this final version, in harder rust-red, was one of two large commissions from the Russian collector Sergei Shchukin, who later complained that his new electric lighting changed how the colors read together at night. Matisse's own credo — an art of balance, purity, and serenity — governs every choice here, including the one deliberate break in the ring of dancers, which reads less like an accident than an open invitation for the viewer to complete the circle.", "spanInContext": [101, 189]}, {"id": "5_Modernism_Painting.md:122:echo-triad:4", "rule": "R20", "name": "Echoing sentence runs", "tier": "medium", "layer": "A", "section": "Gallery — The Starry Night, Vincent van Gogh, 18", "line": 122, "flagged": "The sky is not a record of what the sky looked like. It is a record of what it felt like to look at it.", "context": "**Analysis:** Nothing in this sky behaves the way sky behaves. The stars pull into spirals, the crescent moon burns like a small sun, and a line of flame-shaped cypress trees reaches up from the foreground as if trying to touch what's happening above them. Van Gogh painted this from memory, and largely from imagination, while a patient at the asylum at Saint-Rémy — the church spire below is Dutch, not French, a homesick invention grafted onto a Provençal hillside. Every stroke is visible and directional; nothing is blended smooth. The sky is not a record of what the sky looked like. It is a record of what it felt like to look at it.", "spanInContext": [537, 640]}, {"id": "5_Modernism_Painting.md:4:R18-weak-ending:9", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Introduction", "line": 4, "flagged": "insisting that the old ways of seeing are inadequate to the complexity of modern experience", "context": "Modernism is really a convenient blanket term for a collection of *modernisms*, a series of radical breaks with the conventions that had governed European painting since the Renaissance. The coherent picture plane, the illusion of depth, the unified point of view, the smooth narrative surface: all of these are dismantled, questioned, or abandoned between roughly 1880 and 1950. This is the visual equivalent of Ellison's experiments with the form of the novel: fragmenting perspective, defamiliarizing the reader's understanding of American society, insisting that the old ways of seeing are inadequate to the complexity of modern experience.", "spanInContext": [552, 643]}, {"id": "5_Modernism_Painting.md:44:R18-weak-ending:10", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 44, "flagged": "What is the physical character of the paint itself", "context": "*What is the physical character of the paint itself?*", "spanInContext": [1, 51]}, {"id": "5_Modernism_Painting.md:60:R18-weak-ending:11", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Looking Back", "line": 60, "flagged": "but a new kind of wholeness that can acknowledge its own complexity", "context": "Romanticism had already begun dissolving the Renaissance's confident, measurable space — Turner's storms and Friedrich's fog are early instances of a coherent world coming apart. Modernism completes what Romanticism started and then goes further: not content to overwhelm the rational world with sublime feeling, it dismantles the very idea that painting owes the viewer a stable, unified space at all. Ellison's narrator, emerging from his underground room to affirm that he still has a socially responsible role to play, is reaching for something beyond the fragmentation — not a return to old certainties, but a new kind of wholeness that can acknowledge its own complexity.", "spanInContext": [609, 676]}, {"id": "5_Modernism_Painting.md:22:R17-passive:12", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Invisible Man*", "line": 22, "flagged": "be seen", "context": "Ellison's narrator cannot be seen whole by the society around him. This is not merely a social observation but a formal principle: the novel itself fragments its protagonist across multiple identities, roles, and perspectives — college student, factory worker, Brotherhood orator, underground man — none of which adds up to a complete, coherent self visible from a single vantage point. This is Cubism applied to character. Just as Picasso's figures are seen from everywhere and nowhere simultaneously, Ellison's narrator is defined by the multiple, contradictory ways others see him (or refuse to see him). The \"invisibility\" of the title is not merely a metaphor for racism but a formal condition, the condition of a self that cannot be unified because the social space it inhabits is itself fractured and incoherent.", "spanInContext": [26, 33]}, {"id": "5_Modernism_Painting.md:22:R17-passive:13", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Invisible Man*", "line": 22, "flagged": "are seen", "context": "Ellison's narrator cannot be seen whole by the society around him. This is not merely a social observation but a formal principle: the novel itself fragments its protagonist across multiple identities, roles, and perspectives — college student, factory worker, Brotherhood orator, underground man — none of which adds up to a complete, coherent self visible from a single vantage point. This is Cubism applied to character. Just as Picasso's figures are seen from everywhere and nowhere simultaneously, Ellison's narrator is defined by the multiple, contradictory ways others see him (or refuse to see him). The \"invisibility\" of the title is not merely a metaphor for racism but a formal condition, the condition of a self that cannot be unified because the social space it inhabits is itself fractured and incoherent.", "spanInContext": [450, 458]}, {"id": "5_Modernism_Painting.md:22:R17-passive:14", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Invisible Man*", "line": 22, "flagged": "is defined", "context": "Ellison's narrator cannot be seen whole by the society around him. This is not merely a social observation but a formal principle: the novel itself fragments its protagonist across multiple identities, roles, and perspectives — college student, factory worker, Brotherhood orator, underground man — none of which adds up to a complete, coherent self visible from a single vantage point. This is Cubism applied to character. Just as Picasso's figures are seen from everywhere and nowhere simultaneously, Ellison's narrator is defined by the multiple, contradictory ways others see him (or refuse to see him). The \"invisibility\" of the title is not merely a metaphor for racism but a formal condition, the condition of a self that cannot be unified because the social space it inhabits is itself fractured and incoherent.", "spanInContext": [522, 532]}, {"id": "5_Modernism_Painting.md:24:R17-passive:15", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Invisible Man*", "line": 24, "flagged": "is presented", "context": "Cubism's refusal to privilege a single viewpoint is also a refusal of authority, the authority of the Renaissance tradition that said there was one correct way to see. In Ellison's novel, no single ideology (the college's accommodationism, the Brotherhood's Marxism, Ras the Exhorter's nationalism) is presented as the correct viable frame of meaning and authority. The narrator's journey is precisely the discovery that every frame is partial, and that the only honest position is the one that acknowledges its own partiality.", "spanInContext": [299, 311]}, {"id": "5_Modernism_Painting.md:82:R17-passive:16", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — A Bar at the Folies-Bergère, Édouard M", "line": 82, "flagged": "is understood", "context": "**Analysis:** Manet's canvas predates this unit's own period by nearly two decades and is included here anyway, deliberately, as the clearest single anticipation of everything the twentieth century will do to pictorial space. Start with the barmaid facing forward, then find her reflection in the mirror behind her: it is shifted far to the right, next to a top-hatted customer who has no counterpart standing in front of her. A cartoonist mocked the impossible geometry within Manet's own lifetime — this was noticed immediately, not discovered later by scholars. Manet was, in Baudelaire's phrase, the painter of modern life: the Folies-Bergère was a real, newly electrified cafe-concert, his model Suzon really worked there, and the painting is understood as being about the commodification of modern experience — the barmaid's waist echoing the bowl of oranges beside her, a person and a product occupying the same figure. She meets no one's eyes, least of all the viewer's.", "spanInContext": [745, 758]}, {"id": "5_Modernism_Painting.md:116:R17-passive:17", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — Composition VII, Wassily Kandinsky, 19", "line": 116, "flagged": "is made", "context": "**Prompt:** Stop hunting for objects. The glow here is made by color against color — light with no world behind it, in exactly the sense Kandinsky meant the phrase.", "spanInContext": [52, 59]}]}, {"file": "5_Modernism_Philosophy.md", "words": 2080, "findings": [{"id": "5_Modernism_Philosophy.md:24:not-just:2", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "The Human Position", "line": 24, "flagged": "not merely uncertain, but", "context": "Writing within the (inescapably racialized) context of American history, Du Bois articulates a version of this fractured selfhood that is at once more specific and more devastating. His concept of \"double consciousness\" — the sense of                                                                                                                                                     — describes a condition in which the self is not merely uncertain, but actively split by the social reality of race in America. The Black American, Du Bois argues, lives with                                                        the desire to be both Black and American in a society that has made those identities antagonistic. Readers who have encountered Rousseau's concept of *amour-propre* will recognize a similar warning about the danger of self-consciousness, intensified here by the specific violence of racial hierarchy: the gaze through which one is forced to see oneself emanates from a white majority culture that denies full humanity to Black Americans.", "spanInContext": [428, 453]}, {"id": "5_Modernism_Philosophy.md:54:R2-hedging:3", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "The Individual and Authority", "line": 54, "flagged": "a kind of", "context": "As generational “race men” speaking on behalf of Black America, Washington and Du Bois are both deeply engaged in the problem of formulating a viable response to oppression. Washington's “Atlanta Exposition Address” makes a case for accommodation.                                        Washington urges. Black Americans need to accept, at least temporarily, the existing structures of racial authority and to pursue economic self-improvement within them. The speech is strategic, pragmatic, and deeply controversial, urging Black Americans to defer their claims to full political and social equality in exchange for economic opportunity and (presumed) white goodwill. Du Bois's response, in the opening chapter of *The Souls of Black Folk*, rejects this bargain. He argues that Washington's program demands a kind of psychic self-mutilation, the surrender of the very aspirations (higher education, political rights, civic dignity) that make full human flourishing possible.", "spanInContext": [808, 817]}, {"id": "5_Modernism_Philosophy.md:28:echo-triad:0", "rule": "R20", "name": "Echoing sentence runs", "tier": "medium", "layer": "A", "section": "Connection to *Invisible Man*", "line": 28, "flagged": "Du Bois's double consciousness is the narrator's starting condition, but Ellison pushes beyond Du Bois, suggesting that even the systems designed to liberate the narrator (the Brotherhood, Black nationalism) reproduce the same structure of invisibility. The novel dramatizes, through the specific experience of Black American life in the mid-twentieth century, the Modernist discovery that the \"human position\" is not a given but a problem endlessly complicated and frustrated by the systems designed to answer the question of selfhood.", "context": "The novel's narrator is, from the first page, a human being in crisis. Every institution he encounters — the Southern Black college, the Brotherhood, the Harlem political scene — offers him an identity, a role, a place in a system. Yet every one of these identities turns out to be a version of invisibility: a way of (as he puts in the novel’s opening lines) “refusing” to see him as an individual. Du Bois's double consciousness is the narrator's starting condition, but Ellison pushes beyond Du Bois, suggesting that even the systems designed to liberate the narrator (the Brotherhood, Black nationalism) reproduce the same structure of invisibility. The novel dramatizes, through the specific experience of Black American life in the mid-twentieth century, the Modernist discovery that the \"human position\" is not a given but a problem endlessly complicated and frustrated by the systems designed to answer the question of selfhood.", "spanInContext": [400, 936]}, {"id": "5_Modernism_Philosophy.md:20:x-is-dead:1", "rule": "—", "name": "“X is dead”", "tier": "medium", "layer": "A", "section": "The Human Position", "line": 20, "flagged": "The madman announces that God is dead", "context": "Nietzsche's                         is the foundational text of this crisis. The madman announces that God is dead, that “we” have killed him. But this is not a celebration. It is a catastrophe. In Nietzsche's framing, God was not merely a theological proposition; he was the structure that held everything else together: meaning, morality, the sense that the universe was oriented toward some valuable purpose. Without that structure, the madman asks,                                                                                                  In Nietzsche’s fragmentary vision, the casual atheists who never believed much anyway in the marketplace do not understand what has happened. The madman has come too early. The event of God’s death has not yet reached their ears or defined their experience.", "spanInContext": [77, 114]}, {"id": "5_Modernism_Philosophy.md:18:R18-weak-ending:4", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "The Human Position", "line": 18, "flagged": "s place in the natural order is to make contact with an essential element of modernity itself", "context": "Unlike every other period explored in this course, Modernism simply cannot find or construct an adequate answer to this question. To doubt one’s place in the natural order is to make contact with an essential element of modernity itself.", "spanInContext": [143, 236]}, {"id": "5_Modernism_Philosophy.md:20:R18-weak-ending:5", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "The Human Position", "line": 20, "flagged": "s death has not yet reached their ears or defined their experience", "context": "Nietzsche's                         is the foundational text of this crisis. The madman announces that God is dead, that “we” have killed him. But this is not a celebration. It is a catastrophe. In Nietzsche's framing, God was not merely a theological proposition; he was the structure that held everything else together: meaning, morality, the sense that the universe was oriented toward some valuable purpose. Without that structure, the madman asks,                                                                                                  In Nietzsche’s fragmentary vision, the casual atheists who never believed much anyway in the marketplace do not understand what has happened. The madman has come too early. The event of God’s death has not yet reached their ears or defined their experience.", "spanInContext": [740, 806]}]}, {"file": "5_Modernism_Sculpture.md", "words": 2410, "findings": [{"id": "5_Modernism_Sculpture.md:90:R2-hedging:5", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Gallery — City Square, Alberto Giacometti, 1948 ", "line": 90, "flagged": "a kind of", "context": "**Analysis:** Notice the scale: the figures are small enough to observe from above, which immediately makes you a kind of god or surveillance camera looking down on a city scene. Their elongation is most visible from the side — thinner than any human body could be, as if the sculptor has subtracted from them until only the gesture of being upright and moving remains. Five figures cross a flat bronze base that could be the pavement of any city, near one another yet connecting with none. The work does not represent urban isolation; it produces it.", "spanInContext": [112, 121]}, {"id": "5_Modernism_Sculpture.md:4:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Introduction", "line": 4, "flagged": "no recognizable subject, no depicted figure, no apparent craft", "context": "In 1926, a US Customs official in New York refused to classify Brancusi's *Bird in Space* as a work of art. It looked, to the official's eye, like a piece of industrial metal, a shaft of polished bronze with no recognizable subject, no depicted figure, no apparent craft. The customs service taxed it accordingly. Brancusi sued, and the case went to trial. A federal court was forced to decide, officially and on the record, what counts as sculpture — and in 1928 it ruled for Brancusi, a decision that changed US law to admit abstract art duty-free, as art, whether or not it depicted anything at all.", "spanInContext": [208, 270]}, {"id": "5_Modernism_Sculpture.md:68:is-the-whole:1", "rule": "—", "name": "“Is the whole …”", "tier": "medium", "layer": "A", "section": "Hero — Bird in Space, Constantin Brancusi, 1928 ", "line": 68, "flagged": "is the whole sculpture", "context": "**Prompt:** Find the point where the form stops widening and starts tapering. That single transition is the whole sculpture's argument.", "spanInContext": [101, 123]}, {"id": "5_Modernism_Sculpture.md:36:echo-triad:2", "rule": "R20", "name": "Echoing sentence runs", "tier": "medium", "layer": "A", "section": "Connection to *Invisible Man*", "line": 36, "flagged": "Smith's welded steel and Picasso's cut sheet metal make visible the industrial labor that traditional high culture preferred to keep in the factory and out of the gallery. Ellison makes visible the labor that American culture preferred to keep underground.", "context": "The Liberty Paints factory sequence is *Invisible Man*'s most concentrated meditation on material and making. The narrator works underground, mixing a black substance into white paint to produce \"Optic White\" — the purest white, the standard of American whiteness, produced by invisible Black labor. The scene is an industrial allegory: the material product (white paint) depends on the hidden ingredient (the darkness that makes whiteness possible) and on the invisible worker who adds it. Smith's welded steel and Picasso's cut sheet metal make visible the industrial labor that traditional high culture preferred to keep in the factory and out of the gallery. Ellison makes visible the labor that American culture preferred to keep underground. Both insist that the materials of civilization — steel, paint, language — carry the history of the people who made them and the conditions under which they were made.", "spanInContext": [491, 747]}, {"id": "5_Modernism_Sculpture.md:96:echo-triad:3", "rule": "R20", "name": "Echoing sentence runs", "tier": "medium", "layer": "A", "section": "Gallery — Hudson River Landscape, David Smith, 1", "line": 96, "flagged": "**Eyebrow:** A drawing you can walk around\n\n**Analysis:** Find the gestural lines of welded steel that trace the horizon and the riverbank — this is drawing in three dimensions, a landscape you can walk around.", "context": "**Eyebrow:** A drawing you can walk around", "spanInContext": [0, 210]}, {"id": "5_Modernism_Sculpture.md:56:stacked-questions:4", "rule": "R35", "name": "Stacked rhetorical questions", "tier": "medium", "layer": "A", "section": "Looking Forward", "line": 56, "flagged": "What it leaves is a set of open provocations: if anything can be sculpture, what is sculpture? If the figure is not necessary, what is the human body's place in art? If the pedestal is gone, where does sculpture end and the world begin?", "context": "Modernist sculpture has no single Looking Forward — it ends the course's arc rather than passing its questions to another period. What it leaves is a set of open provocations: if anything can be sculpture, what is sculpture? If the figure is not necessary, what is the human body's place in art? If the pedestal is gone, where does sculpture end and the world begin? These questions do not resolve; they persist. Ellison's narrator, at the novel's end, prepares to emerge from his underground room into a world that has not changed. He does not have answers. He has, instead, the refusal to remain invisible, the insistence on existing as a particular, irreducible self in a world that would prefer he be something else. That refusal is a sharp analogue to the impulse that drives much Modernist sculpture.", "spanInContext": [130, 366]}, {"id": "5_Modernism_Sculpture.md:40:R18-weak-ending:6", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 40, "flagged": "and how does placement shape meaning", "context": "*Where does the sculpture live, and how does placement shape meaning?*", "spanInContext": [32, 68]}, {"id": "5_Modernism_Sculpture.md:6:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Introduction", "line": 6, "flagged": "are depicted", "context": "Modernist sculpture does not merely change how figures are depicted; it dismantles the assumptions that made depiction the point. The human body, the single material worked by a single hand, the pedestal that elevates the work above the everyday world, the finished surface — all of these are questioned, abandoned, or turned into subjects in themselves.", "spanInContext": [55, 67]}, {"id": "5_Modernism_Sculpture.md:8:R17-passive:8", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Introduction", "line": 8, "flagged": "is seen", "context": "*Invisible Man* operates under the same pressure. The novel's central question is about classification: what counts, what is seen, whose existence is legible to the systems that govern recognition. Brancusi's bird and Ellison's narrator face parallel problems: neither can be seen for what they are by institutions built around narrow definitions of what to look for and where to look. Unlike Brancusi, the narrator has no court to rule in his favor.", "spanInContext": [122, 129]}, {"id": "5_Modernism_Sculpture.md:8:R17-passive:9", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Introduction", "line": 8, "flagged": "be seen", "context": "*Invisible Man* operates under the same pressure. The novel's central question is about classification: what counts, what is seen, whose existence is legible to the systems that govern recognition. Brancusi's bird and Ellison's narrator face parallel problems: neither can be seen for what they are by institutions built around narrow definitions of what to look for and where to look. Unlike Brancusi, the narrator has no court to rule in his favor.", "spanInContext": [273, 280]}, {"id": "5_Modernism_Sculpture.md:32:R17-passive:10", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Material & Making", "line": 32, "flagged": "was made", "context": "David Smith welded steel. He had worked in an automobile plant and a locomotive factory before becoming a sculptor, and he brought those industrial skills directly into his art — cutting, grinding, and welding metal the way a factory worker assembles parts. *Hudson River Landscape* was made by welding together gestural lines of steel drawn from sketches Smith made on a train journey along the Hudson; the finished work is simultaneously a drawing, a landscape, and a sculptural object, occupying a category of its own creation. Picasso's constructed guitar and Smith's welded steel share a common premise: the sculptor is not obligated to work in traditional materials, and the choice of material is itself a statement about what a culture values and what it throws away.", "spanInContext": [283, 291]}, {"id": "5_Modernism_Sculpture.md:36:R17-passive:11", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Invisible Man*", "line": 36, "flagged": "were made", "context": "The Liberty Paints factory sequence is *Invisible Man*'s most concentrated meditation on material and making. The narrator works underground, mixing a black substance into white paint to produce \"Optic White\" — the purest white, the standard of American whiteness, produced by invisible Black labor. The scene is an industrial allegory: the material product (white paint) depends on the hidden ingredient (the darkness that makes whiteness possible) and on the invisible worker who adds it. Smith's welded steel and Picasso's cut sheet metal make visible the industrial labor that traditional high culture preferred to keep in the factory and out of the gallery. Ellison makes visible the labor that American culture preferred to keep underground. Both insist that the materials of civilization — steel, paint, language — carry the history of the people who made them and the conditions under which they were made.", "spanInContext": [904, 913]}, {"id": "5_Modernism_Sculpture.md:42:R17-passive:12", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 42, "flagged": "was designed", "context": "Giacometti's *City Square* was designed to be placed on the floor, without a pedestal, at human scale, five figures on a flat bronze base that could be the pavement of any city. This is Rodin's ground-level gesture pushed to its limits: the street itself made into sculpture. The work does not represent urban isolation; it produces it. Looking down at the figures, the viewer becomes another figure moving through the same space, equally isolated, equally unnoticed.", "spanInContext": [27, 39]}, {"id": "5_Modernism_Sculpture.md:42:R17-passive:13", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 42, "flagged": "be placed", "context": "Giacometti's *City Square* was designed to be placed on the floor, without a pedestal, at human scale, five figures on a flat bronze base that could be the pavement of any city. This is Rodin's ground-level gesture pushed to its limits: the street itself made into sculpture. The work does not represent urban isolation; it produces it. Looking down at the figures, the viewer becomes another figure moving through the same space, equally isolated, equally unnoticed.", "spanInContext": [43, 52]}]}, {"file": "00_Medieval_Painting.md", "words": 1514, "findings": [{"id": "00_Medieval_Painting.md:12:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Figure & Space", "line": 12, "flagged": "no horizon line, no vanishing point, no attempt to place figures in a measurable physical space", "context": "Medieval figures exist against flat backgrounds, often embellished with shimmering gold leaf meant to represent divine light, the radiance of heaven. There is no horizon line, no vanishing point, no attempt to place figures in a measurable physical space. Instead, the **hieratic scale** of size indicates importance: Christ and the Virgin are larger than saints, who are larger than donors.", "spanInContext": [159, 254]}, {"id": "00_Medieval_Painting.md:60:is-the-whole:1", "rule": "—", "name": "“Is the whole …”", "tier": "medium", "layer": "A", "section": "Hero — Annunciation with St. Margaret and St. An", "line": 60, "flagged": "is the whole point", "context": "**Prompt:** Look for a horizon line or a light source. You will not find either — and that absence is the whole point.", "spanInContext": [99, 117]}, {"id": "00_Medieval_Painting.md:38:stranded-auxiliary:2", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Brushwork & Surface", "line": 38, "flagged": "; fidelity to a received tradition was.", "context": "Individual brushwork is suppressed in favor of precise, anonymous craftsmanship. **Tempera** paint (pigment mixed with egg yolk) was applied in thin, careful layers. The artist's personality was not the point; fidelity to a received tradition was. The act of painting was closer to devotional labor than personal expression. The smooth, icon-like surfaces reflect a world in which the individual artist's hand mattered far less than the sacred truth being transmitted.", "spanInContext": [208, 247]}, {"id": "00_Medieval_Painting.md:36:R18-weak-ending:3", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 36, "flagged": "What is the physical character of the paint itself", "context": "*What is the physical character of the paint itself?*", "spanInContext": [1, 51]}, {"id": "00_Medieval_Painting.md:76:R17-passive:4", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The Maestà, Duccio, 1311", "line": 76, "flagged": "is rendered", "context": "Duccio stacks the heavenly court in tiers rather than in depth. The enthroned Virgin is rendered far larger than the saints and angels ranked around her — her scale announces her rank, not her nearness to us. There is no floor receding to a horizon; the gold ground refuses physical space altogether, so the eye reads position as spiritual hierarchy.", "spanInContext": [85, 96]}]}, {"file": "00_Medieval_Sculpture.md", "words": 2025, "findings": [{"id": "00_Medieval_Sculpture.md:20:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Connection to *Hamlet*", "line": 20, "flagged": "no afterlife in that sequence, no weighing of souls", "context": "Hamlet enacts a memento mori over Yorick's skull, and the trajectory he traces is entirely material: a jester's mouth he once kissed, a nobleman's dust, a bunghole stopping a beer barrel.                                             There is no afterlife in that sequence, no weighing of souls — only decay following its course. It is the Last Judgment tympanum with the judgment removed. Then, a scene later, he accepts that there is                                                and the medieval frame he had just emptied out closes back over him. The tension is not between the play and the period; it runs through Hamlet across two consecutive scenes.", "spanInContext": [241, 292]}, {"id": "00_Medieval_Sculpture.md:54:no-chain:1", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Looking Forward", "line": 54, "flagged": "no building and no theological hierarchy", "context": "The Renaissance will make everything the medieval cathedral suppresses the center of its program: the individual body, the named maker, the freestanding work that belongs to no building and no theological hierarchy. Donatello's *David* — nude, slight, self-possessed, standing free in space — is the precise inversion of a Chartres column figure. Where the medieval sculptor gives the body to the building, Donatello gives it back to itself. Where Gislebertus signs beneath the feet of Christ and leaves his meaning unresolved, Michelangelo signs across the Virgin's sash and leaves nothing in doubt. The contrast is sharpest where the subject is identical: the Röttgen Christ is a corpse in rigor, and Michelangelo's is a beautiful young body asleep across his mother's knees. The same moment, the same doctrine, two centuries apart — and the later one has decided that suffering ought to be composed. The revolution is total, and its consequences are still playing out in *Hamlet*, where a mind formed in the Renaissance finds itself haunted by a world that has not yet made that journey.", "spanInContext": [174, 214]}, {"id": "00_Medieval_Sculpture.md:46:echo-triad:2", "rule": "R20", "name": "Echoing sentence runs", "tier": "medium", "layer": "A", "section": "Space & Setting", "line": 46, "flagged": "Bernini stages an encounter with the divine as theater — immersive, spectacular, emotionally overwhelming. The medieval cathedral stages an encounter with the divine as *cosmos* — one is not watching something happen but being located within a structure that contains everything that has ever happened or will happen.", "context": "This is total environment in a completely different sense from Bernini'
