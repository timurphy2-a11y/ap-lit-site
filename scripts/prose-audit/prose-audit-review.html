s Cornaro Chapel. Bernini stages an encounter with the divine as theater — immersive, spectacular, emotionally overwhelming. The medieval cathedral stages an encounter with the divine as *cosmos* — one is not watching something happen but being located within a structure that contains everything that has ever happened or will happen.", "spanInContext": [89, 406]}, {"id": "00_Medieval_Sculpture.md:38:R18-weak-ending:3", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 38, "flagged": "and how does placement shape meaning", "context": "*Where does the sculpture live, and how does placement shape meaning?*", "spanInContext": [32, 68]}, {"id": "00_Medieval_Sculpture.md:16:R17-passive:4", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Body & Volume", "line": 16, "flagged": "be made", "context": "The *Röttgen Pietà*, carved nearly two centuries after Autun, shows what else the medieval body could be made to carry. Christ's corpse is emaciated to the ribs, stiffened past the point where it could fold naturally into his mother's lap, the wounds opened wide enough to read across a room. Mary's face registers bewilderment rather than foreknowledge. None of this is legible as hierarchy; nothing here encodes rank. This body is not a sign to be interpreted but a provocation to feeling — the sculptural equivalent of what the period's mystics were attempting in prose. The medieval body is a spiritual instrument in both cases. At Autun it instructs. In the *Pietà* it wounds.", "spanInContext": [102, 109]}, {"id": "00_Medieval_Sculpture.md:44:R17-passive:5", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 44, "flagged": "was made", "context": "There is a third setting, and it is smaller than either. The *Röttgen Pietà* was made as an *Andachtsbild* — an image for private contemplation, scaled to one person's field of view. The portal addresses everyone who passes beneath it. The cathedral contains everyone standing inside it. The devotional image addresses a single viewer at a time, and what it asks for is not awe but identification.", "spanInContext": [77, 85]}, {"id": "00_Medieval_Sculpture.md:50:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Connection to *Hamlet*", "line": 50, "flagged": "be held", "context": "Elsinore is a medieval space organized around judgment and hierarchy — a court where one's place in the order of things is everything, where the king's word is law, where the ghost of a murdered father demands that his son fulfill a duty assigned from beyond the grave. The ghost's demand is the Last Judgment tympanum made personal: everyone will be held accountable, the dead have claims on the living, and the proper response is obedience to a structure of authority that transcends individual will. Hamlet's tragedy is that he has a Renaissance mind trapped in a medieval world. He cannot simply obey — he must verify, question, and understand — but the world he inhabits has no place for that kind of hesitation. The cathedral portal does not ask whether we accept its terms. We pass beneath the judgment whether we believe in it or not.", "spanInContext": [348, 355]}, {"id": "00_Medieval_Sculpture.md:54:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Looking Forward", "line": 54, "flagged": "be composed", "context": "The Renaissance will make everything the medieval cathedral suppresses the center of its program: the individual body, the named maker, the freestanding work that belongs to no building and no theological hierarchy. Donatello's *David* — nude, slight, self-possessed, standing free in space — is the precise inversion of a Chartres column figure. Where the medieval sculptor gives the body to the building, Donatello gives it back to itself. Where Gislebertus signs beneath the feet of Christ and leaves his meaning unresolved, Michelangelo signs across the Virgin's sash and leaves nothing in doubt. The contrast is sharpest where the subject is identical: the Röttgen Christ is a corpse in rigor, and Michelangelo's is a beautiful young body asleep across his mother's knees. The same moment, the same doctrine, two centuries apart — and the later one has decided that suffering ought to be composed. The revolution is total, and its consequences are still playing out in *Hamlet*, where a mind formed in the Renaissance finds itself haunted by a world that has not yet made that journey.", "spanInContext": [890, 901]}, {"id": "00_Medieval_Sculpture.md:74:R17-passive:8", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — Röttgen Pietà, Anonymous (Middle Rhine", "line": 74, "flagged": "is composed", "context": "Mary holds the body of her son, and nothing about the encounter is composed. Christ is emaciated to the ribs, the wounds cut open wide, the crown of thorns still driven into his scalp. His body has stiffened and will not settle into her lap. The whole object is painted wood, under three feet tall, made for one person to kneel in front of rather than for a crowd to pass beneath.", "spanInContext": [64, 75]}]}, {"file": "4_Romantic_Painting.md", "words": 1855, "findings": [{"id": "4_Romantic_Painting.md:82:stranded-auxiliary:0", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Gallery — The Slave Ship, J.M.W. Turner, 1840 *(", "line": 82, "flagged": ", as he often did;", "context": "**Analysis:** A blood-red sunset takes most of the canvas and the solid forms give way inside it — the ship tilts into a churning distance, and the drowning figures in the foreground are legible mainly as a manacled leg and a scatter of hands among the fish. Turner exhibited it with lines of his own poetry attached, as he often did; paint and text were a single argument for him. The practice behind the picture was real. In 1781 enslaved people were thrown from the slave ship *Zong* so that the owners could claim them as an insurance loss, and the court case that followed became a centerpiece of British abolitionist campaigning.", "spanInContext": [316, 334]}, {"id": "4_Romantic_Painting.md:18:R18-weak-ending:1", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Connection to *Moby-Dick*", "line": 18, "flagged": "a human scene set against a natural world that conceals its meaning", "context": "Ishmael clinging to Queequeg's coffin in an indifferent ocean captures the Romantic reversal of scale that runs through the entire novel. Whether Ishmael at the masthead, Ahab on the quarterdeck, or Pip lost in the open sea, the human figure is perpetually dwarfed by a natural world that exceeds comprehension. The ocean functions exactly as landscape does in Friedrich or Turner: not a setting but a force, not a background but the primary reality against which human meaning is tested. In \"Bartleby,\" the overwhelming space inverts — it becomes the dead wall Bartleby stares at, the claustrophobic office that shrinks the human figure rather than dwarfing it against nature. In *Benito Cereno*, the becalmed ship on an opaque sea is itself a Romantic composition: a human scene set against a natural world that conceals its meaning.", "spanInContext": [767, 834]}, {"id": "4_Romantic_Painting.md:32:R18-weak-ending:2", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 32, "flagged": "What is the physical character of the paint itself", "context": "*What is the physical character of the paint itself?*", "spanInContext": [1, 51]}, {"id": "4_Romantic_Painting.md:40:R18-weak-ending:3", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Connection to *Moby-Dick*", "line": 40, "flagged": "This is precisely the Romantic principle that the medium is part of the meaning", "context": "Melville's prose style is the literary equivalent of Turner's late brushwork. His sentences do not politely describe the ocean; they *enact* it — surging, accumulating, crashing across the page in long, rhythmically complex periods that seem to move with the energy of the phenomena they describe. The famous cetology chapters, the rhetorical set pieces, the passages of visionary intensity all insist on a prose surface with its own energy and physicality. Melville's language is not transparent; it is a force. This is precisely the Romantic principle that the medium is part of the meaning.", "spanInContext": [513, 592]}, {"id": "4_Romantic_Painting.md:68:R17-passive:4", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — Liberty Leading the People, Eugène Del", "line": 68, "flagged": "is made", "context": "**Prompt:** Look at Liberty's feet, then at the dead men she is stepping over. She is made of the same paint they are.", "spanInContext": [83, 90]}, {"id": "4_Romantic_Painting.md:74:R17-passive:5", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The Raft of the Medusa, Théodore Géric", "line": 74, "flagged": "was made", "context": "**Analysis:** Read the composition as two competing diagonals: a pyramid of straining bodies climbs from the dead and dying in the foreground toward a single figure waving a scrap of cloth, while a second line runs down the mast and sail and pulls the opposite way. At the apex — the one point of hope in the picture — Géricault placed a Black man, one of several on the raft, modeled by a man named Joseph who worked in Paris studios. France was still running slaving ships when the painting was made. Géricault exhibited it not under the scandal's name but as *Scene of a Shipwreck*, which turned a specific government embarrassment into a statement about everyone.", "spanInContext": [493, 501]}]}, {"file": "4_Romanticism_Sculpture.md", "words": 1778, "findings": [{"id": "4_Romanticism_Sculpture.md:44:the-entire-is:0", "rule": "—", "name": "“The entire … is”", "tier": "medium", "layer": "A", "section": "Connection to *Moby-Dick*", "line": 44, "flagged": "the entire novel as the thing Ahab is", "context": "The contrast between Rodin's ground-level grief and Rude's elevated civic energy maps onto a tension at the heart of *Moby-Dick*. The *Pequod* is a commercial vessel with a manifest public purpose — a whaling ship was a floating factory, and every man aboard has signed for a share of the profit. Ahab overrides that purpose on the quarterdeck, nailing up the doubloon and converting a business voyage into a private revenge, and Starbuck objects out loud, on deck, in front of the crew: they are there to fill barrels, not to take vengeance on a dumb brute. Melville does not remove the economics. He keeps them running underneath the entire novel as the thing Ahab is betraying. Rodin strips the civic elevation from figures standing in a civic square; Ahab strips the commercial purpose from a commercial ship, and Starbuck spends the rest of the book unable to get it back.", "spanInContext": [632, 669]}, {"id": "4_Romanticism_Sculpture.md:36:R18-weak-ending:1", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 36, "flagged": "and how does placement shape meaning", "context": "*Where does the sculpture live, and how does placement shape meaning?*", "spanInContext": [32, 68]}, {"id": "4_Romanticism_Sculpture.md:70:R17-passive:2", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The Gates of Hell, Auguste Rodin, 1880", "line": 70, "flagged": "are made", "context": "**Analysis:** Find *The Thinker* on the tympanum above the doors. At this scale he is small, and he is not contemplating in any restful sense — the toes grip, the back locks, the whole body strains at what is supposedly an act of mind. Then read downward. Near the top the figures stay distinct; toward the base and the outer edges they lose definition and sink back into the bronze they are made of. Rodin cast individual figures from these doors as independent works for the rest of his career, which means a good deal of what looks like a famous sculpture standing alone in a museum began as a detail on this one.", "spanInContext": [388, 396]}]}]}</script>

<script>
const PERIODS = [
  [/^00_|medieval/i,      'Medieval',      'var(--medieval)'],
  [/^1_|renaissance/i,    'Renaissance',   'var(--renaissance)'],
  [/^2_|baroque/i,        'Baroque',       'var(--baroque)'],
  [/^3_|enlightenment/i,  'Enlightenment', 'var(--enlightenment)'],
  [/^4_|roman(tic|ticism)/i,'Romanticism', 'var(--romanticism)'],
  [/^5_|modernism/i,      'Modernism',     'var(--modernism)'],
];

const GLOSS = {
  'R2':'Hedging qualification. Phrases that soften a claim without adding information. Make the claim directly or cut it.',
  'R7/R26':'Negative correction before the positive claim. State the positive directly.',
  'R1/R26':'Defining by what a thing lacks rather than what it does. State the positive organizing principle.',
  'R8/R31':'Second person in analytical prose. Replace with first person plural, third person, or an impersonal construction.',
  'R3/R28/R30':'A sentence that restates what the paragraph just showed. End at the last new piece of information.',
  'R1/R6/R19':'Throat-clearing. An opening that announces the argument rather than making it.',
  'R18':'The last word of a paragraph carries disproportionate weight. Avoid ending on a conjunction or an abstraction.',
  'R17':'Passive construction. Passive voice distances the argument from its subject.',
  'R34':'Figurative or inflated language that direct statement would carry without loss.',
  'R20':'Consecutive sentences repeating the same skeleton. Integrate rather than juxtapose.',
  'R35':'Questions that probe the same underlying concern. Merge them.',
  'R22':'An interpretive claim stated as fact. Consider "can be read as".',
  'R10':'Inflated significance in place of saying what happened.',
  'R12':'A claim asserted without the specific detail that demonstrates it.',
  '—':'Flagged as a general LLM cliché with no direct guide rule. Judgement call.',
};

const RAW = JSON.parse(document.getElementById('data').textContent);
let items = flatten(RAW);
let decisions = {};
let i = 0;

function flatten(raw){
  const out=[];
  for(const d of raw.docs) for(const f of d.findings) out.push({...f, file:d.file});
  return out;
}
function periodOf(file){
  for(const [re,name,col] of PERIODS) if(re.test(file)) return {name,col};
  return {name:'—',col:'var(--dim)'};
}
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

/* ---- persistence (window.storage, in-memory fallback) ---- */
const KEY='prose-audit-decisions-v1';
async function save(){
  try{ await window.storage.set(KEY, JSON.stringify(decisions)); }catch(e){}
}
async function load(){
  try{ const r=await window.storage.get(KEY); if(r&&r.value) decisions=JSON.parse(r.value); }
  catch(e){ decisions={}; }
}

/* ---- render ---- */
function render(){
  const m=document.querySelector('#meter>div');
  const decided=Object.keys(decisions).length;
  m.style.width=(items.length?decided/items.length*100:0)+'%';

  document.getElementById('tally').innerHTML =
    `<b>${decided}</b> of <b>${items.length}</b> decided`;

  if(!items.length){ document.getElementById('main').innerHTML =
    '<div class="done"><h2>Nothing to review</h2><p>Load a run to begin.</p></div>'; return; }

  const it=items[i];
  const p=periodOf(it.file);
  const hd=document.querySelector('header');
  hd.style.setProperty('--accent',p.col);
  document.getElementById('period').textContent=p.name;
  document.getElementById('file').textContent=it.file.replace(/\.md$/,'');
  document.getElementById('sect').textContent=it.section;
  document.getElementById('count').textContent=`${i+1} / ${items.length}`;

  // mark the flagged span inside its paragraph
  let [a,b]=it.spanInContext;
  if(it.context.slice(a,b)!==it.flagged){
    const j=it.context.indexOf(it.flagged);
    if(j>=0){a=j;b=j+it.flagged.length;} else {a=b=0;}
  }
  const body = a===b
    ? esc(it.context)
    : esc(it.context.slice(0,a))+'<mark>'+esc(it.context.slice(a,b))+'</mark>'+esc(it.context.slice(b));

  const d=decisions[it.id]||{};
  const gloss=GLOSS[it.rule]||GLOSS['—'];

  document.getElementById('main').innerHTML=`
    <p class="para">${body}</p>
    <div class="verdict">
      <span class="code">${esc(it.rule)}</span>
      <span class="vname">${esc(it.name)}</span>
      <span class="tier">${esc(it.tier)} confidence</span>
    </div>
    <p class="gloss">${esc(gloss)}</p>
    <div class="choices">
      <button class="choice" data-v="revise" aria-pressed="${d.verdict==='revise'}">
        <span class="g">&#9998;</span>Revise<kbd>1</kbd></button>
      <button class="choice" data-v="keep" aria-pressed="${d.verdict==='keep'}">
        <span class="g">&#10003;</span>Keep as written<kbd>2</kbd></button>
      <button class="choice" data-v="skip" aria-pressed="${d.verdict==='skip'}">
        <span class="g">&#8212;</span>Decide later<kbd>3</kbd></button>
    </div>
    ${d.verdict==='revise'?`
      <textarea id="rewrite" placeholder="Rewrite the flagged text, or leave a note for the edit pass…">${esc(d.rewrite||it.flagged)}</textarea>
      <p class="hint">Saved as you type</p>`:''}
    <nav class="pager">
      <button id="prev" ${i===0?'disabled':''}>&#8592; Previous</button>
      <button id="next" ${i===items.length-1?'disabled':''}>Next &#8594;</button>
      <span class="spacer">&#8592; &#8594; to move &nbsp;·&nbsp; 1 2 3 to decide</span>
    </nav>`;

  document.querySelectorAll('.choice').forEach(b=>
    b.onclick=()=>decide(b.dataset.v));
  document.getElementById('prev').onclick=()=>go(-1);
  document.getElementById('next').onclick=()=>go(1);
  const ta=document.getElementById('rewrite');
  if(ta) ta.oninput=()=>{decisions[it.id].rewrite=ta.value;save();};
}

function decide(v){
  const it=items[i];
  const prev=decisions[it.id];
  decisions[it.id]={...it, verdict:v, rewrite:(prev&&prev.rewrite)||''};
  save();
  const advance = v!=='revise';
  render();
  if(advance && i<items.length-1) setTimeout(()=>go(1),120);
  else if(v==='revise'){const ta=document.getElementById('rewrite');if(ta)ta.focus();}
}
function go(n){ i=Math.max(0,Math.min(items.length-1,i+n)); render();
  window.scrollTo({top:0,behavior:'smooth'}); }

document.addEventListener('keydown',e=>{
  if(e.target.tagName==='TEXTAREA'){ if(e.key==='Escape')e.target.blur(); return; }
  if(document.getElementById('dlg').open) return;
  if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='ArrowRight')go(1);
  else if(e.key==='1')decide('revise');
  else if(e.key==='2')decide('keep');
  else if(e.key==='3')decide('skip');
});

/* ---- dialogs ---- */
const dlg=document.getElementById('dlg');
document.getElementById('dlgClose').onclick=()=>dlg.close();

document.getElementById('export').onclick=()=>{
  const by={};
  for(const k in decisions){const d=decisions[k];(by[d.file]=by[d.file]||[]).push(d);}
  let out='# Prose audit decisions\n\nGenerated '+new Date().toISOString().slice(0,10)+
    '\n\nRule numbers refer to the Writing and Editing Guide.\n';
  for(const f of Object.keys(by).sort()){
    const revise=by[f].filter(d=>d.verdict==='revise');
    const later=by[f].filter(d=>d.verdict==='skip');
    if(!revise.length&&!later.length) continue;
    out+=`\n## ${f}\n`;
    for(const d of revise){
      out+=`\n### ${d.rule} — ${d.name} (line ${d.line}, ${d.section})\n`;
      out+=`- Flagged: ${d.flagged.trim()}\n`;
      out+=`- Replace with: ${(d.rewrite||'').trim()||'[no rewrite supplied]'}\n`;
    }
    if(later.length){
      out+=`\n**Deferred:** `+later.map(d=>`${d.rule} line ${d.line}`).join('; ')+'\n';
    }
  }
  const kept=Object.values(decisions).filter(d=>d.verdict==='keep').length;
  out+=`\n---\n\n${kept} finding(s) reviewed and kept as written.\n`;
  openDlg('Export decisions', out, 'Download .md', ()=>{
    const blob=new Blob([out],{type:'text/markdown'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob); a.download='prose-audit-decisions.md'; a.click();
    URL.revokeObjectURL(a.href);
  });
};

document.getElementById('load').onclick=()=>{
  openDlg('Paste JSON from a fresh run','','Load', ()=>{
    try{
      const parsed=JSON.parse(document.getElementById('dlgText').value);
      items=flatten(parsed); i=0; dlg.close(); render();
    }catch(err){ alert('That did not parse as audit JSON: '+err.message); }
  });
  document.getElementById('dlgText').placeholder='node prose-audit.js <dir> --json';
};

document.getElementById('reset').onclick=async()=>{
  if(!confirm('Clear all decisions? This cannot be undone.'))return;
  decisions={}; await save(); render();
};

function openDlg(title,text,actionLabel,fn){
  document.getElementById('dlgTitle').textContent=title;
  document.getElementById('dlgText').value=text;
  const btn=document.getElementById('dlgAction');
  btn.textContent=actionLabel; btn.onclick=fn;
  dlg.showModal();
}

load().then(render);
</script>
