<style>
  :root{
    --ground:#14110D; --surface:#1D1A15; --raised:#252118;
    --rule:#332C24; --ink:#EDE7DA; --dim:#9A9084; --faint:#6B6358;
    --flag:#D9A441;
    --medieval:#C9A227; --renaissance:#C4503F; --baroque:#B5751F;
    --enlightenment:#6E93BF; --romanticism:#5E9468; --modernism:#8499AB;
    --serif:'Source Serif 4',Georgia,serif;
    --display:'Cormorant Garamond',Georgia,serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--serif)}
  body{min-height:100vh;display:flex;flex-direction:column}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
  :focus-visible{outline:2px solid var(--flag);outline-offset:3px}

  /* progress meter — the only full-bleed element */
  #meter{height:2px;background:var(--rule);flex:none}
  #meter>div{height:100%;background:var(--flag);width:0;transition:width .25s ease}
  @media (prefers-reduced-motion:reduce){#meter>div{transition:none}}

  header{
    display:flex;align-items:baseline;gap:.9rem;flex-wrap:wrap;
    padding:1.1rem 1.5rem .9rem;border-bottom:1px solid var(--rule);
    font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;text-transform:uppercase;
  }
  .period{color:var(--accent,var(--dim));font-weight:600}
  .period::before{content:"";display:inline-block;width:.5rem;height:.5rem;
    background:var(--accent,var(--dim));margin-right:.45rem;transform:translateY(-1px)}
  header .file{color:var(--dim)}
  header .sect{color:var(--faint);text-transform:none;letter-spacing:.02em;font-style:italic;font-family:var(--serif)}
  header .count{margin-left:auto;color:var(--faint)}

  main{flex:1;width:100%;max-width:44rem;margin:0 auto;padding:2.6rem 1.5rem 3rem}

  /* the reading surface — everything else defers to this */
  .para{font-size:1.24rem;line-height:1.78;letter-spacing:.002em}
  .para em{color:var(--ink)}
  mark{
    background:none;color:var(--ink);
    border-bottom:2px solid var(--flag);
    box-shadow:inset 0 -0.62em 0 rgba(217,164,65,.13);
    padding-bottom:1px;
  }

  .verdict{
    margin-top:2.2rem;padding-top:1.1rem;border-top:1px solid var(--rule);
    display:flex;gap:.85rem;align-items:baseline;flex-wrap:wrap;
  }
  .code{font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;
    color:var(--flag);border:1px solid var(--rule);padding:.2rem .45rem;flex:none}
  .vname{font-family:var(--display);font-size:1.3rem;font-style:italic}
  .tier{font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-left:auto}
  .gloss{margin:.7rem 0 0;color:var(--dim);font-size:.96rem;line-height:1.6;max-width:38rem}

  /* decisions — never distinguished by hue alone: each has a distinct
     glyph, border weight and text label, for red-green colour blindness */
  .choices{display:flex;gap:.6rem;margin-top:1.8rem;flex-wrap:wrap}
  .choice{
    display:flex;align-items:center;gap:.55rem;
    border:1px solid var(--rule);padding:.6rem .95rem;background:var(--surface);
    font-size:.94rem;transition:border-color .15s,background .15s;
  }
  .choice:hover{border-color:var(--faint)}
  .choice .g{font-family:var(--mono);font-size:.9rem;color:var(--dim);width:1ch;text-align:center}
  .choice kbd{font-family:var(--mono);font-size:.62rem;color:var(--faint);
    border:1px solid var(--rule);padding:.05rem .3rem;margin-left:.15rem}
  .choice[aria-pressed="true"]{background:var(--raised);border-color:var(--flag);border-left-width:4px;padding-left:calc(.95rem - 3px)}
  .choice[aria-pressed="true"] .g{color:var(--flag)}

  textarea{
    display:block;width:100%;margin-top:1.1rem;min-height:7.5rem;resize:vertical;
    background:var(--surface);border:1px solid var(--rule);color:var(--ink);
    font-family:var(--serif);font-size:1.02rem;line-height:1.65;padding:.85rem .95rem;
  }
  textarea::placeholder{color:var(--faint);font-style:italic}
  .hint{font-family:var(--mono);font-size:.63rem;letter-spacing:.07em;
    color:var(--faint);margin-top:.55rem;text-transform:uppercase}

  nav.pager{display:flex;gap:1.4rem;align-items:center;margin-top:2.4rem;
    padding-top:1.1rem;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;color:var(--dim)}
  nav.pager button:disabled{color:var(--faint);cursor:default}
  nav.pager .spacer{margin-left:auto}

  footer{border-top:1px solid var(--rule);padding:.85rem 1.5rem;
    display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;
    font-family:var(--mono);font-size:.66rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
  footer button{color:var(--dim);border-bottom:1px solid var(--rule);padding-bottom:1px}
  footer button:hover{color:var(--flag);border-color:var(--flag)}
  footer .tally{margin-left:auto;color:var(--faint)}
  footer .tally b{color:var(--dim);font-weight:400}

  dialog{background:var(--surface);color:var(--ink);border:1px solid var(--rule);
    max-width:46rem;width:92vw;padding:1.4rem}
  dialog::backdrop{background:rgba(10,8,6,.82)}
  dialog h2{font-family:var(--display);font-style:italic;font-weight:400;font-size:1.5rem;margin:0 0 .8rem}
  dialog textarea{min-height:16rem;font-family:var(--mono);font-size:.76rem;line-height:1.5}
  .done{text-align:center;padding:4rem 0}
  .done h2{font-family:var(--display);font-size:2rem;font-style:italic;font-weight:400;margin:0 0 .6rem}
  .done p{color:var(--dim)}
</style>

<div id="meter"><div></div></div>
<header>
  <span class="period" id="period">—</span>
  <span class="file" id="file"></span>

  <span class="count" id="count"></span>
</header>

<main id="main"></main>

<footer>
  <button id="export">Export decisions</button>
  <button id="load">Load a fresh run</button>
  <button id="reset">Clear decisions</button>
  <span class="tally" id="tally"></span>
</footer>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <textarea id="dlgText" spellcheck="false"></textarea>
  <nav class="pager">
    <button id="dlgAction">Copy</button>
    <button id="dlgClose" class="spacer">Close</button>
  </nav>
</dialog>

spanInContext": [238, 246]}, {"id": "00_Medieval_Music.md:4:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Introduction", "line": 4, "flagged": "no harmony in the modern sense, no bass line, no chords, no accompaniment", "context": "Medieval music, like medieval painting, operates on assumptions that can seem foreign to modern ears. The dominant form of sacred music was plainchant, defined by a single melodic line, unaccompanied, sung in unison by monks or clergy. There is no harmony in the modern sense, no bass line, no chords, no accompaniment: just a single human voice (or many voices singing the same melody) moving through a sacred text. The effect is austere, timeless, and deeply meditative, music that exists not to entertain or to express individual emotion but to serve as a vehicle for prayer.", "spanInContext": [245, 318]}, {"id": "00_Medieval_Music.md:12:no-chain:1", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Texture & Voices", "line": 12, "flagged": "no harmony, no counterpoint, no distinction between a \"lead\" voice and \"supporting\" voices", "context": "The defining texture of medieval sacred music is **monophony** — a single melodic line with no accompaniment. Even when many voices sing together, they sing the same melody in unison. There is no harmony, no counterpoint, no distinction between a \"lead\" voice and \"supporting\" voices. This is the sonic equivalent of the gold background in medieval painting: no spatial depth, no foreground and background, no figure-ground relationship. The music exists in a single plane, and that flatness is the point. It reflects a worldview in which individual expression is subordinate to collective worship, just as the anonymous medieval painter subordinated personal style to sacred tradition.", "spanInContext": [193, 283]}, {"id": "00_Medieval_Music.md:12:no-chain:2", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Texture & Voices", "line": 12, "flagged": "no spatial depth, no foreground and background, no figure-ground relationship", "context": "The defining texture of medieval sacred music is **monophony** — a single melodic line with no accompaniment. Even when many voices sing together, they sing the same melody in unison. There is no harmony, no counterpoint, no distinction between a \"lead\" voice and \"supporting\" voices. This is the sonic equivalent of the gold background in medieval painting: no spatial depth, no foreground and background, no figure-ground relationship. The music exists in a single plane, and that flatness is the point. It reflects a worldview in which individual expression is subordinate to collective worship, just as the anonymous medieval painter subordinated personal style to sacred tradition.", "spanInContext": [359, 436]}, {"id": "00_Medieval_Music.md:18:no-chain:3", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Consonance & Dissonance", "line": 18, "flagged": "no harmonic tension, no pull toward resolution", "context": "In monophonic chant, the question of consonance and dissonance barely arises; there is only one melodic line, and no simultaneous notes to be in tension with each other. The melody moves through intervals that the medieval ear considered sacred and mathematically pure: the octave, the fifth, the fourth. The effect is music of extraordinary purity and stability. There is no harmonic tension, no pull toward resolution, because there is nothing to resolve. This is the sonic equivalent of the uniform, shadowless light in medieval painting: a world without ambiguity, where everything exists in the steady radiance of divine order.", "spanInContext": [373, 419]}, {"id": "00_Medieval_Music.md:24:no-chain:4", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Structure & Freedom", "line": 24, "flagged": "no bar lines, no regular beat, no meter in the modern sense", "context": "Plainchant follows the structure of the liturgical text rather than an abstract musical form. The melody serves the words: it rises and falls with the rhythms of Latin prayer, expanding on important syllables and moving simply through less significant ones. There are no bar lines, no regular beat, no meter in the modern sense. The rhythm is free and fluid, governed by the natural flow of speech rather than by a pulse; Medieval chant exists outside the grid of regular rhythm that virtually all later Western music takes for granted. Form is entirely determined by the sacred purpose. The music is not a performance; it is an act of devotion.", "spanInContext": [268, 327]}, {"id": "00_Medieval_Music.md:30:no-chain:5", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Connection to *Hamlet*", "line": 30, "flagged": "no pulse, no rhythmic compulsion, no invitation to physical response", "context": "Medieval music refuses the body by design: no pulse, no rhythmic compulsion, no invitation to physical response. The music exists in a realm the body cannot easily enter. Hamlet inherits this suspicion in a specific form. The court’s demand that he perform his grief correctly, dress it in “inky cloak” and                                    is a demand that he subordinate inner experience to outward form, managing and controlling the body for social consumption. What he refuses is not form itself but the severing of form from genuine feeling. “These indeed seem,” he says of the outward displays; they are the body disciplined into performance, emptied of the interiority that makes them authentic.", "spanInContext": [43, 111]}, {"id": "00_Medieval_Music.md:34:no-chain:6", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "What to Listen For", "line": 34, "flagged": "no harmony, no bass, no rhythm section", "context": "In the *Ave Maris Stella* above, listen for the purity of the single unaccompanied line — no harmony, no bass, no rhythm section. Notice how the melody rises and falls with the Latin words rather than following a regular beat. The effect is timeless and meditative, existing outside the pulse-driven framework of virtually all later Western music.", "spanInContext": [90, 128]}]}, {"file": "00_Medieval_Philosophy.md", "words": 1997, "findings": [{"id": "00_Medieval_Philosophy.md:31:not-just:2", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Knowledge and Its Limits", "line": 31, "flagged": "This is not anti-intellectualism; it is", "context": "The *Cloud of Unknowing* pushes this hierarchy to its mystical extreme. The anonymous monk argues that God cannot be reached by the intellect at all — only by love.                                                                                                                                                                              The path to God requires not more knowledge but less — a deliberate embrace of intellectual darkness, a \"cloud of unknowing\" between yourself and the divine.                                                                       This is not anti-intellectualism; it is a claim that the deepest reality exceeds the capacity of the mind and can only be approached through the heart's surrender.", "spanInContext": [566, 605]}, {"id": "00_Medieval_Philosophy.md:35:not-just:3", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Knowledge and Its Limits", "line": 35, "flagged": "it is not a hypothesis; it is", "context": "The summary of Aristotelian physics makes those boundaries explicit: four elements with natural places, celestial bodies made of incorruptible ether, a clear distinction between earthly corruption and heavenly perfection. This is the cosmology that Copernicus, Galileo, and Newton will demolish — but in the Medieval period it is not a hypothesis; it is the structure of reality.", "spanInContext": [324, 353]}, {"id": "00_Medieval_Philosophy.md:61:R2-hedging:4", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Looking Forward: The Full Arc", "line": 61, "flagged": "in many ways", "context": "This unit exists to give students a baseline — not a straw man to be knocked down, but a coherent and in many ways admirable intellectual world whose assumptions the rest of the course will trace, challenge, transform, and in some cases mourn the loss of. The Medieval certainties — a meaningful universe, a knowable human place within it, a trustworthy path to truth, a legitimate structure of authority — are not stupid or naive. They represent answers to permanent human questions. What makes the subsequent periods compelling is not that they simply reject those answers but that they struggle with the consequences of losing them.", "spanInContext": [102, 114]}, {"id": "00_Medieval_Philosophy.md:31:R8-second-person:5", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Knowledge and Its Limits", "line": 31, "flagged": "yourself", "context": "The *Cloud of Unknowing* pushes this hierarchy to its mystical extreme. The anonymous monk argues that God cannot be reached by the intellect at all — only by love.                                                                                                                                                                              The path to God requires not more knowledge but less — a deliberate embrace of intellectual darkness, a \"cloud of unknowing\" between yourself and the divine.                                                                       This is not anti-intellectualism; it is a claim that the deepest reality exceeds the capacity of the mind and can only be approached through the heart's surrender.", "spanInContext": [4 emological world: in that world, the authority of a returning spirit is not something you verify. You obey it.", "spanInContext": [781, 784]}, {"id": "00_Medieval_Philosophy.md:49:R8-second-person:8", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "The Individual and Authority", "line": 49, "flagged": "your", "context": "Augustine's *Confessions* is the great narrative of this alignment. The entire arc of the book moves toward the moment of surrender — the moment when Augustine stops resisting and allows God to claim him. The passage in your reading captures the agonizing final stages: Augustine knows what he should do, he is almost there, but his will is divided against itself. The \"trifles of trifles\" — his old habits, pleasures, attachments — pull him back. What finally breaks the deadlock is not a rational argument but an act of grace: he hears a child's voice saying                     opens the Bible, and the conversion is accomplished. The individual does not overcome authority; the individual is overcome *by* authority — and this is presented as liberation, not subjugation.", "spanInContext": [220, 224]}, {"id": "00_Medieval_Philosophy.md:16:echo-triad:0", "rule": "R20", "name": "Echoing sentence runs", "tier": "medium", "layer": "A", "section": "The Human Position", "line": 16, "flagged": "The human position, in Augustine's account, is one of radical dependence.\n\nThe anonymous ballad \"The Unquiet Grave\" captures the Medieval sense of the human position in a different register, emotional rather than theological.", "context": "Augustine's *Confessions* dramatizes the psychological dimension of this struggle. The drama of the *Confessions* is the drama of Augustine’s surrender to God, the agonizing difficulty of submitting his will to a truth he already recognizes. His inner conflict is not between competing identities or values (as it might be for a modern character), but between his fal "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Knowledge and Its Limits", "line": 35, "flagged": "it is the structure of reality", "context": "The summary of Aristotelian physics makes those boundaries explicit: four elements with natural places, celestial bodies made of incorruptible ether, a clear distinction between earthly corruption and heavenly perfection. This is the cosmology that Copernicus, Galileo, and Newton will demolish — but in the Medieval period it is not a hypothesis; it is the structure of reality.", "spanInContext": [348, 378]}, {"id": "00_Medieval_Philosophy.md:14:R17-passive:11", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "The Human Position", "line": 14, "flagged": "is given", "context": "The Medieval answer is clear, and it is given not as a philosophical argument but as a description of reality: human beings are creatures of God, made in his image but fallen through sin, positioned in a Great Chain of Being that extends from God and the angels at the top through humanity in the middle, down to animals, plants, and inanimate matter at the bottom. One’s place in this chain is not something one chose or can change. It is given. The human task is not to reinvent ourselves (as Pico will later propose) but to fulfill the role we have been assigned: to survive our limited time in the temporal world unscathed by sin and to work toward salvation through faith and obedience.", "spanInContext": [37, 45]}, {"id": "00_Medieval_Philosophy.md:14:R17-passive:12", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "The Human Position", "line": 14, "flagged": "is given", "context": "The Medieval answer is clear, and it is given not as a philosophical argument but as a description of reality: human beings are creatures of God, made in his image but fallen through sin, positioned in a Great Chain of Being that extends from God and the angels at the top through humanity in the middle, down to animals, plants, and inanimate matter at the bottom. One’s place in this chain is not something one chose or can change. It is given. The human task is not to reinvent ourselves (as Pico will later propose) but to fulfill the role we have been assigned: to survive our limited time in the temporal world unscathed by sin and to work toward salvation through faith and obedience.", "spanInContext": [437, 445]}, {"id": "00_Medieval_Philosophy.md:49:R17-passive:13", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "The Individual and Authority", "line": 49, "flagged": "is presented", "context": "Augustine's *Confessions* is the great narrative of this alignment. The entire arc of the book moves toward the moment of surrender — the moment when Augustine stops resisting and allows God to claim him. The passage in your reading captures the agonizing final stages: Augustine knows what he should do, he is almost there, but his will is divided against itself. The \"trifles of trifles\" — his old habits, pleasures, attachments — pull him back. What finally breaks the deadlock is not a rational argument but an act of grace: he hears a child's voice saying                     opens the Bible, and the conversion is accomplished. The individual does not overcome authority; the individual is overcome *by* authority — and this is presented as liberation, not subjugation.", "spanInContext": [731, 743]}]}, {"file": "1_Renaissance_Music.md", "words": 1073, "findings": [{"id": "1_Renaissance_Music.md:4:ai-vocab:0", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Introduction", "line": 4, "flagged": "seamless", "context": "Renaissance music is the sonic equivalent of Renaissance perspective in painting: ordered, balanced, and governed by rational rules that produce a feeling of serene harmony. Where medieval music was predominantly monophonic, Renaissance composers developed polyphony into a high art, weaving multiple independent vocal lines into a seamless, interlocking whole. The result is music that sounds both complex and effortlessly beautiful.", "spanInContext": [332, 340]}, {"id": "1_Renaissance_Music.md:16:ai-vocab:1", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Connection to *Hamlet*", "line": 16, "flagged": "interplay", "context": "The play inherits this Renaissance ideal of balanced, rational discourse, the humanist conviction that truth emerges from the interplay of multiple perspectives. Hamlet himself is a master of dialogue, debate, and rhetorical self-examination. Yet the play's action also strains against the polyphonic ideal; Hamlet's voice increasingly dominates, the other characters become instruments of his obsession or targets of his contempt, and the balanced interplay of perspectives gives way to a single consciousness in crisis. Renaissance polyphony assumes that multiple voices can coexist in harmony; *Hamlet* explores the consequences of one voice beginning to overwhelm all others.", "spanInContext": [126, 135]}, {"id": "1_Renaissance_Music.md:16:ai-vocab:2", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Connection to *Hamlet*", "line": 16, "flagged": "interplay", "context": "The play inherits this Renaissance ideal of balanced, rational discourse, the humanist conviction that truth emerges from the interplay of multiple perspectives. Hamlet himself is a master of dialogue, debate, and rhetorical self-examination. Yet the play's action also strains against the polyphonic ideal; Hamlet's voice increasingly dominates, the other characters become instruments of his obsession or targets of his contempt, and the balanced interplay of perspectives gives way to a single consciousness in crisis. Renaissance polyphony assumes that multiple voices can coexist in harmony; *Hamlet* explores the consequences of one voice beginning to overwhelm all others.", "spanInContext": [449, 458]}, {"id": "1_Renaissance_Music.md:48:ai-vocab:3", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Looking Back", "line": 48, "flagged": "seamless", "context": "The shift from medieval monophony to Renaissance polyphony is one of the most dramatic transformations in the history of Western music. Where the *Ave Maris Stella* offered a single, unaccompanied line, Palestrina offers four independent melodies woven into a seamless fabric. The musical world has gone from flat to three-dimensional, from monologue to conversation, exactly as the visual world went from gold-ground icons to perspectival space.", "spanInContext": [260, 268]}, {"id": "1_Renaissance_Music.md:52:ai-vocab:4", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Looking Forward", "line": 52, "flagged": "interplay", "context": "The Baroque will take Renaissance polyphony and charge it with dramatic intensity. The balanced, serene interplay of equal voices will give way to the dramatic contrasts of the concerto (solo against ensemble) and the intellectual rigor of the fugue (a single theme pursued through increasingly complex transformations). Where Renaissance music resolves its tensions smoothly and promptly, Baroque music will exploit those tensions for emotional and dramatic effect, the musical equivalent of the shift from Renaissance perspective to Baroque chiaroscuro.", "spanInContext": [104, 113]}, {"id": "1_Renaissance_Music.md:4:R3-summary-opener:5", "rule": "R3/R28/R30", "name": "Summarizing sentence opener", "tier": "high", "layer": "B", "section": "Introduction", "line": 4, "flagged": "The result is music that sounds both complex and effortlessly beautiful.", "context": "Renaissance music is the sonic equivalent of Renaissance perspective in painting: ordered, balanced, and governed by rational rules that produce a feeling of serene harmony. Where medieval music was predominantly monophonic, Renaissance composers developed polyphony into a high art, weaving multiple independent vocal lines into a seamless, interlocking whole. The result is music that sounds both complex and effortlessly beautiful.", "spanInContext": [362, 434]}, {"id": "1_Renaissance_Music.md:12:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Texture & Voices", "line": 12, "flagged": "are carefully designed", "context": "The defining texture of Renaissance music is **polyphony** — multiple independent melodic lines sounding simultaneously. In a four-voice motet, each voice (soprano, alto, tenor, bass) has its own melody, and these melodies are carefully designed to fit together harmonically while remaining distinct. No single voice dominates; all are equal participants in a shared musical fabric. This is the sonic equivalent of Renaissance perspective: individual figures, each with their own identity, coexisting in a rationally ordered space. It also mirrors the humanist ideal of balanced discourse: multiple voices, each contributing, none overwhelming.", "spanInContext": [223, 245]}]}, {"file": "1_Renaissance_Painting.md", "words": 1844, "findings": [{"id": "1_Renaissance_Painting.md:34:ai-vocab:2", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Brushwork & Surface", "line": 34, "flagged": "seamless", "context": "Renaissance painters developed **oil painting**, which allowed far greater subtlety than tempera. Oils could be blended smoothly, layered in translucent glazes, and worked over long periods. The brushwork is controlled and largely invisible, seeking to create a seamless illusion. A great painting should look like the world, not like paint applied to a flat surface.", "spanInContext": [262, 270]}, {"id": "1_Renaissance_Painting.md:4:not-just:3", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Introduction", "line": 4, "flagged": "not just a technical achievement but", "context": "The Renaissance represents one of the most dramatic shifts in the history of European art. Painters developed sophisticated techniques to make paintings look like windows onto the three-dimensional, physical world. This was not just a technical achievement but a philosophical revolution. To paint a measurable space with individual human beings standing in it was to declare that the physical world, and the individual's experience of it, mattered.", "spanInContext": [224, 260]}, {"id": "1_Renaissance_Painting.md:71:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Gallery — The Alba Madonna, Raphael, 1510", "line": 71, "flagged": "no gold, no hierarchy of scale", "context": "### Gallery — The Alba Madonna, Raphael, 1510\nRaphael resolves the difficult circular (tondo) format through a stable pyramidal composition: the Virgin's body forms a broad triangle whose apex is her head, anchoring the three figures in serene equilibrium. She sits directly on the ground in a real landscape with a distant horizon — no gold, no hierarchy of scale, only weighted bodies in measurable space. Harmony here is not decoration; it is the Renaissance conviction that the world is intelligible.", "spanInContext": [334, 364]}, {"id": "1_Renaissance_Painting.md:78:stranded-auxiliary:1", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Gallery — The Last Supper, Leonardo da Vinci, 14", "line": 78, "flagged": ": they all agree on where the light is.", "context": "**Prompt:** Follow the shadows: they all agree on where the light is. Nothing floats.", "spanInContext": [30, 69]}, {"id": "1_Renaissance_Painting.md:32:R18-weak-ending:4", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 32, "flagged": "What is the physical character of the paint itself", "context": "*What is the physical character of the paint itself?*", "spanInContext": [1, 51]}, {"id": "1_Renaissance_Painting.md:24:R17-passive:5", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Light & Shadow", "line": 24, "flagged": "be directly seen", "context": "Renaissance light becomes naturalistic. It comes from a specific direction and casts real shadows. Leonardo da Vinci developed **sfumato**, a technique of softly blending tones to create an atmospheric haze that gives figures a mysterious, living quality. Light now reveals form: it curves around a cheek, catches an eye, models the folds of drapery. The world has become something that can be directly seen and measured, rather than something received on faith.", "spanInContext": [391, 407]}, {"id": "1_Renaissance_Painting.md:40:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 40, "flagged": "are conventionally understood", "context": "The year matters as much as the technique. Holbein painted it in 1533, the hinge year of the English Reformation: Henry VIII's secret marriage in January, the break with Rome across the spring, Elizabeth's birth in September. Read against that, the still life's quieter details are conventionally understood to be doing the same work as the skull — a lute with a broken string, an arithmetic book open to a page on division, and, half-hidden behind the curtain at the upper left, a silver crucifix. Discord, division, and a glimpse of eternity behind the worldly display.", "spanInContext": [278, 307]}, {"id": "1_Renaissance_Painting.md:81:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — The School of Athens, Raphael, 1511", "line": 81, "flagged": "is given", "context": "### Gallery — The School of Athens, Raphael, 1511\nFind the vanishing point at the dead center of the composition, between Plato and Aristotle. Every architectural line — the coffered vaults, the floor tiles, the receding arches — converges on that single point, pulling your eye into a deep, rationally organized space. The philosophers of antiquity stand on a solid, measurable floor, gathered in an ideal humanist architecture where reason itself is given a stage.", "spanInContext": [449, 457]}]}, {"file": "1_Renaissance_Philosophy.md", "words": 1485, "findings": [{"id": "1_Renaissance_Philosophy.md:44:R2-hedging:2", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "The Individual and Authority", "line": 44, "flagged": "in a sense", "context": "**Connection to *Hamlet*:** The play is set in a court — a structure of authority — and its protagonist is both a product of that structure and in revolt against it. Hamlet's struggle is precisely about what it means to follow your own conscience when every institution around you is compromised. Claudius controls the court, Polonius controls the flow of information, Rosencrantz and Guildenstern are agents of surveillance. Hamlet is, in a sense, a one-man Reformation: an individual who insists on seeing the truth for himself, at whatever cost. But the play is not naive about the consequences of that insistence. Following your conscience may be heroic, but it can also lead to paralysis, cruelty, and catastrophe.", "spanInContext": [437, 447]}, {"id": "1_Renaissance_Philosophy.md:8:R8-second-person:3", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Introduction", "line": 8, "flagged": "you", "context": "The readings in this unit come from thinkers who are creating that pressure, or responding to it, or both. What connects them is not a single argument but a shared atmosphere of intellectual daring and anxiety, the exhilaration of discovering that the world is not what you were told it was, mixed with the vertigo of realizing that the old certainties are not going to be replaced by new ones anytime soon.", "spanInContext": [270, 273]}, {"id": "1_Renaissance_Philosophy.md:44:R8-second-person:4", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "The Individual and Authority", "line": 44, "flagged": "your", "context": "**Connection to *Hamlet*:** The play is set in a court — a structure of authority — and its protagonist is both a product of that structure and in revolt against it. Hamlet's struggle is precisely about what it means to follow your own conscience when every institution around you is compromised. Claudius controls the court, Polonius controls the flow of information, Rosencrantz and Guildenstern are agents of surveillance. Hamlet is, in a sense, a one-man Reformation: an individual who insists on seeing the truth for himself, at whatever cost. But the play is not naive about the consequences of that insistence. Following your conscience may be heroic, but it can also lead to paralysis, cruelty, and catastrophe.", "spanInContext": [227, 231]}, {"id": "1_Renaissance_Philosophy.md:44:R8-second-person:5", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "The Individual and Authority", "line": 44, "flagged": "you", "context": "**Connection to *Hamlet*:** The play is set in a court — a structure of authority — and its protagonist is both a product of that structure and in revolt against it. Hamlet's struggle is precisely about what it means to follow your own conscience when every institution around you is compromised. Claudius controls the court, Polonius controls the flow of information, Rosencrantz and Guildenstern are agents of surveillance. Hamlet is, in a sense, a one-man Reformation: an individual who insists on seeing the truth for himself, at whatever cost. But the play is not naive about the consequences of that insistence. Following your conscience may be heroic, but it can also lead to paralysis, cruelty, and catastrophe.", "spanInContext": [277, 280]}, {"id": "1_Renaissance_Philosophy.md:44:R8-second-person:6", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "The Individual and Authority", "line": 44, "flagged": "your", "context": "**Connection to *Hamlet*:** The play is set in a court — a structure of authority — and its protagonist is both a product of that structure and in revolt against it. Hamlet's struggle is precisely about what it means to follow your own conscience when every institution around you is compromised. Claudius controls the court, Polonius controls the flow of information, Rosencrantz and Guildenstern are agents of surveillance. Hamlet is, in a sense, a one-man Reformation: an individual who insists on seeing the truth for himself, at whatever cost. But the play is not naive about the consequences of that insistence. Following your conscience may be heroic, but it can also lead to paralysis, cruelty, and catastrophe.", "spanInContext": [628, 632]}, {"id": "1_Renaissance_Philosophy.md:18:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "The Human Position", "line": 18, "flagged": "no divine architect, no fixed human nature, no afterlife", "context": "This is an extraordinary claim, and it reverberates through the entire Renaissance. It underwrites the period's celebration of individual genius (Leonardo, Michelangelo, Shakespeare himself), its fascination with self-fashioning and performance, and its darker preoccupation with the dangers of unchecked ambition. Stephen Greenblatt's excerpt from *The Swerve* traces a related thread: the recovery of the ancient Roman poet Lucretius, whose materialist vision of a universe of atoms in motion with no divine architect, no fixed human nature, no afterlife, provided a philosophical framework for the Renaissance embrace of human freedom and worldly pleasure.", "spanInContext": [500, 556]}, {"id": "1_Renaissance_Philosophy.md:32:stacked-questions:1", "rule": "R35", "name": "Stacked rhetorical questions", "tier": "medium", "layer": "A", "section": "Knowledge and Its Limits", "line": 32, "flagged": "His central problem is epistemological: how can he know what is true? The ghost claims to be his father, but how can he be certain?", "context": "**Connection to *Hamlet*:** Hamlet is a student returned from Wittenberg, the university where Luther nailed his theses, the intellectual epicenter of the Reformation. He is surrounded by people who are performing, deceiving, and spying. His central problem is epistemological: how can he know what is true? The ghost claims to be his father, but how can he be certain? Claudius appears to be a good king, but appearances are unreliable. Hamlet devises an empirical test (the play-within-the-play) to verify the ghost's claims, but even after the test apparently succeeds, certainty remains elusive. The play dramatizes the exhilaration and the terror of the Renaissance's new relationship to knowledge. One can no longer trust what one has been told, but the solitary pursuit of truth may be more than the individual can bear.", "spanInContext": [238, 369]}, {"id": "1_Renaissance_Philosophy.md:14:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "The Human Position", "line": 14, "flagged": "was given", "context": "The Medieval answer was clear. Human beings occupied a specific rung on the Great Chain of Being — above animals, below angels, beneath God. One's place was given, not chosen. The task was not to reinvent oneself but to fulfill the role assigned by one's Creator.", "spanInContext": [153, 162]}]}, {"file": "1_Renaissance_Sculpture.md", "words": 1826, "findings": [{"id": "1_Renaissance_Sculpture.md:12:R2-hedging:4", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Body & Volume", "line": 12, "flagged": "in a way", "context": "The recovery of the classical body is the Renaissance's foundational sculptural act. Donatello's *David* (c. 1440s) is the first freestanding nude figure in European sculpture since antiquity — a startling, almost uncanny object in its moment. It is not the body of a warrior but of an adolescent: slight, relaxed, one hip dropped in *contrapposto*, Goliath's head already under his foot. The victory is over. The boy stands in the aftermath, self-possessed in a way that feels almost indifferent, his gaze downward, the drama resolved before we arrived.", "spanInContext": [458, 466]}, {"id": "1_Renaissance_Sculpture.md:24:R2-hedging:5", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Material & Making", "line": 24, "flagged": "in a way", "context": "The Renaissance sculptor works mainly in three materials: marble, bronze, and glazed terracotta. Each carries its own set of ambitions. Marble is the material of antiquity, the classical tradition the Renaissance is consciously recovering — but it is also significantly harder than the limestone medieval cathedral sculptors worked in, and far less forgiving. A mistake that might be corrected in limestone can shatter marble. Working it demands individual mastery in a way that large-scale workshop carving of softer stone does not. Michelangelo famously claimed that he simply removed the excess marble to reveal the figure already inside — a statement that captures the period's conviction that artistic genius is a form of perception, not merely of craft. The hardness of the material is part of what makes that claim meaningful: only an exceptional individual hand could do this.", "spanInContext": [465, 473]}, {"id": "1_Renaissance_Sculpture.md:4:R8-second-person:6", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Introduction", "line": 4, "flagged": "your", "context": "Medieval sculpture served architecture. Figures filled the portals of cathedrals, populated the capitals of columns, and illustrated biblical narratives on tympanums, but they did so as part of a larger program, subordinated to the building's theological and structural purposes. The Renaissance reclaims sculpture as an independent art form capable of making its own claims about the world. The freestanding human figure returns for the first time since antiquity, and with it comes a new set of questions: What can a body say? How much can marble feel? What does it mean to sign your name to a work of stone?", "spanInContext": [581, 585]}, {"id": "1_Renaissance_Sculpture.md:4:stacked-questions:0", "rule": "R35", "name": "Stacked rhetorical questions", "tier": "medium", "layer": "A", "section": "Introduction", "line": 4, "flagged": "The freestanding human figure returns for the first time since antiquity, and with it comes a new set of questions: What can a body say? How much can marble feel? What does it mean to sign your name to a work of stone?", "context": "Medieval sculpture served architecture. Figures filled the portals of cathedrals, populated the capitals of columns, and illustrated biblical narratives on tympanums, but they did so as part of a larger program, subordinated to the building's theological and structural purposes. The Renaissance reclaims sculpture as an independent art form capable of making its own claims about the world. The freestanding human figure returns for the first time since antiquity, and with it comes a new set of questions: What can a body say? How much can marble feel? What does it mean to sign your name to a work of stone?", "spanInContext": [392, 610]}, {"id": "1_Renaissance_Sculpture.md:6:stranded-auxiliary:1", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Introduction", "line": 6, "flagged": ", a name, and a will.", "context": "These questions produce some of the most powerful objects in Western art. They resonate directly with *Hamlet*, a play that continually interrogates what it means to be a human being in possession of a body, a name, and a will.", "spanInContext": [206, 227]}, {"id": "1_Renaissance_Sculpture.md:30:promo:2", "rule": "R34", "name": "Promotional boilerplate", "tier": "medium", "layer": "A", "section": "Material & Making", "line": 30, "flagged": "in the heart of", "context": "The period also introduces another significant innovation: the named maker. Medieval sculptors were largely anonymous, their identities subsumed into the workshop and the cathedral program. Michelangelo's signature runs across the strap of the Virgin's robe in the *Pietà* — a young sculptor from Florence asserting, in the heart of Rome, that the work is his, and his alone. This is not vanity but a new cultural claim: the individual artist's vision is the work's meaning.", "spanInContext": [317, 332]}, {"id": "1_Renaissance_Sculpture.md:80:promo:3", "rule": "R34", "name": "Promotional boilerplate", "tier": "medium", "layer": "A", "section": "Gallery — Pietà, Michelangelo Buonarroti, 1499", "line": 80, "flagged": "in the heart of", "context": "**Prompt:** The one sculpture Michelangelo ever signed — carved into the Virgin's sash, a genius asserting authorship in the heart of Rome.", "spanInContext": [118, 133]}, {"id": "1_Renaissance_Sculpture.md:30:R18-weak-ending:7", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Material & Making", "line": 30, "flagged": "the individual artist's vision is the work's meaning", "context": "The period also introduces another significant innovation: the named maker. Medieval sculptors were largely anonymous, their identities subsumed into the workshop and the cathedral program. Michelangelo's signature runs across the strap of the Virgin's robe in the *Pietà* — a young sculptor from Florence asserting, in the heart of Rome, that the work is his, and his alone. This is not vanity but a new cultural claim: the individual artist's vision is the work's meaning.", "spanInContext": [421, 473]}, {"id": "1_Renaissance_Sculpture.md:38:R18-weak-ending:8", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 38, "flagged": "and how does placement shape meaning", "context": "*Where does the sculpture live, and how does placement shape meaning?*", "spanInContext": [32, 68]}, {"id": "1_Renaissance_Sculpture.md:48:R18-weak-ending:9", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Connection to *Hamlet*", "line": 48, "flagged": "Both Michelangelo and Shakespeare represent the body in death as a site of irreducible meaning", "context": "Hamlet is a play acutely aware of settings and the meanings they impose. The court is a theater of surveillance; the graveyard is the one space where the play's pretenses fall away; the stage on which the players perform is a trap for a king. The *Pietà*'s placement in a funeral chapel resonates with the play's graveyard scene, where Hamlet holds Yorick's skull and confronts the body stripped of everything — name, performance, significance — that made it human. Both Michelangelo and Shakespeare represent the body in death as a site of irreducible meaning.", "spanInContext": [466, 560]}, {"id": "1_Renaissance_Sculpture.md:14:R17-passive:10", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Body & Volume", "line": 14, "flagged": "is depicted", "context": "Michelangelo's *David* (1504) makes a radically different temporal choice. Here the figure is depicted pre-action: colossal, taut, the gaze fixed on a point just off to the left where Goliath presumably stands. Every muscle is articulated with anatomical precision — the veins in the hand, the tension across the shoulders, the weight shifted onto the right leg. Yet the body is not yet moving. This *David* holds the instant of decision, the moment when the will is fully committed but the act has not yet begun. It is the most concentrated image of human agency produced by the Renaissance.", "spanInContext": [91, 102]}, {"id": "1_Renaissance_Sculpture.md:40:R17-passive:11", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 40, "flagged": "were made", "context": "Both of Michelangelo's major works in this gallery were made for specific public contexts that shaped their meaning. The *David* was commissioned for the Florence Cathedral but ultimately placed in the Piazza della Signoria — the civic heart of the republic — where it stood as a symbol of Florentine defiance, the small city facing down the colossal powers arrayed against it. The figure's size (seventeen feet) was calculated to be read from below and at a distance, in the open air of a public square rather than the intimate scale of a gallery.", "spanInContext": [51, 60]}, {"id": "1_Renaissance_Sculpture.md:42:R17-passive:12", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 42, "flagged": "was made", "context": "The *Pietà* was made for a very different setting: a cardinal's funeral chapel in St. Peter's Basilica. Where the *David* dominates civic space, the *Pietà* occupies a sacred space. The intimacy of the group (the Virgin's lap cradling the full-grown body of her son) creates a scale that feels private, almost unbearably close, even when viewed in a vast basilica. The human figure belongs equally to the piazza and the chapel, to public life and to grief.", "spanInContext": [12, 20]}, {"id": "1_Renaissance_Sculpture.md:73:R17-passive:13", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — David, Donatello, 1440", "line": 73, "flagged": "is made", "context": "### Gallery — David, Donatello, 1440\nNotice the absence of effort, heroism, or drama. The boy simply stands, the giant's head beneath his heel, an expression of mild unconcern on his face. Cast in bronze — the material of ancient civic monuments and imperial statues — this claim of imperial dignity is made not for a general or a saint but for a slight, nude adolescent. It is a strange and disquieting image of power, and the first freestanding nude since antiquity.", "spanInContext": [300, 307]}]}, {"file": "2_Baroque_Music.md", "words": 1374, "findings": [{"id": "2_Baroque_Music.md:52:ai-vocab:0", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Looking Back", "line": 52, "flagged": "interplay", "context": "Where Renaissance polyphony wove equal voices into serene, balanced interplay, Baroque music introduces dramatic inequality: the soloist against the ensemble, the individual theme against its contrapuntal elaborations, the sudden shift from quiet to overwhelming. Palestrina's luminous calm has given way to Bach's intellectual intensity and Handel's dramatic power, just as the rational serenity of Raphael has given way to the chiaroscuro of Caravaggio.", "spanInContext": [68, 77]}]}, {"file": "2_Baroque_Painting.md", "words": 2304, "findings": [{"id": "2_Baroque_Painting.md:36:not-just:1", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Connection to *Paradise Lost*", "line": 36, "flagged": "not merely settings but", "context": "Milton's visual depiction of Hell —                                         — offers the literary equivalent of Baroque chiaroscuro. The phrase is itself a paradox worthy of Caravaggio: a darkness so thick it becomes something one can see, a light so diminished that it only makes the surrounding blackness more palpable. Throughout *Paradise Lost*, light and darkness are not merely settings but moral and theological forces. God is light; Satan's rebellion is a flight into shadow. Yet Milton, like the best Baroque painters, refuses to make this simple. Satan in Hell retains a \"faded splendor.\" The former Lucifer is a figure of ruined light, and his diminished radiance emerging from the surrounding darkness is pure Baroque drama.", "spanInContext": [373, 396]}, {"id": "2_Baroque_Painting.md:16:R2-hedging:2", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Figure & Space", "line": 16, "flagged": "a kind of", "context": "Baroque compositions are dynamic and often unstable. Figures twist, reach, fall, and surge diagonally across the canvas rather than standing in balanced symmetry. The space around them is often ambiguous: figures emerge from deep shadow, and the boundaries of the room or landscape may be invisible. In Rembrandt's work, figures float in a kind of luminous darkness; one senses space but cannot measure it. No longer calmly surveying the bright and legible landscape of the Renaissance image, the individual is now caught up in the dark grip of forces larger than they can comprehend.", "spanInContext": [338, 347]}, {"id": "2_Baroque_Painting.md:46:stranded-auxiliary:0", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Brushwork & Surface", "line": 46, "flagged": ", each given the exact value it would actually have.", "context": "Vermeer takes the opposite route to the same destination. His surfaces are polished nearly to invisibility, and the paint is used to describe light so precisely that light becomes the subject — a plaster wall, a window frame, the rim of a brass pan, each given the exact value it would actually have. Where Rembrandt's paint insists on being seen as paint, Vermeer's vanishes so completely that the room seems to have been observed rather than made. Both are arguments about surface. One says the making is the meaning; the other says the making should leave no trace at all.", "spanInContext": [248, 300]}, {"id": "2_Baroque_Painting.md:40:R18-weak-ending:3", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 40, "flagged": "What is the physical character of the paint itself", "context": "*What is the physical character of the paint itself?*", "spanInContext": [1, 51]}, {"id": "2_Baroque_Painting.md:32:R17-passive:4", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Light & Shadow", "line": 32, "flagged": "were made", "context": "The technique detonated in a world without electric light. These altarpieces were made for chapels lit by candles and oil lamps, so the painted beam blazed out of a real surrounding gloom — the darkness inside the picture and the darkness in the room were continuous, and a worshipper could not tell exactly where one ended. Something of the original effect survives in the Contarelli Chapel at San Luigi dei Francesi in Rome, where Caravaggio's Saint Matthew cycle still hangs: visitors drop a coin into a box, a lamp comes on for a few minutes, and the paintings emerge out of the dark before sinking back into it.", "spanInContext": [77, 86]}, {"id": "2_Baroque_Painting.md:46:R17-passive:5", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 46, "flagged": "is used", "context": "Vermeer takes the opposite route to the same destination. His surfaces are polished nearly to invisibility, and the paint is used to describe light so precisely that light becomes the subject — a plaster wall, a window frame, the rim of a brass pan, each given the exact value it would actually have. Where Rembrandt's paint insists on being seen as paint, Vermeer's vanishes so completely that the room seems to have been observed rather than made. Both are arguments about surface. One says the making is the meaning; the other says the making should leave no trace at all.", "spanInContext": [122, 129]}, {"id": "2_Baroque_Painting.md:46:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 46, "flagged": "being seen", "context": "Vermeer takes the opposite route to the same destination. His surfaces are polished nearly to invisibility, and the paint is used to describe light so precisely that light becomes the subject — a plaster wall, a window frame, the rim of a brass pan, each given the exact value it would actually have. Where Rembrandt's paint insists on being seen as paint, Vermeer's vanishes so completely that the room seems to have been observed rather than made. Both are arguments about surface. One says the making is the meaning; the other says the making should leave no trace at all.", "spanInContext": [336, 346]}, {"id": "2_Baroque_Painting.md:97:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Gallery — Self-Portrait, Rembrandt van Rijn, 165", "line": 97, "flagged": "is constructed", "context": "### Gallery — Self-Portrait, Rembrandt van Rijn, 1659\nLook closely at the highlighted flesh — the forehead, the nose, the collar — where the paint is thick and sculptural, built up in ridges that catch actual light on the canvas surface. The shadows, by contrast, are painted thinly and transparently. Now look at the hat and the shoulders, and notice how much smoother they are: the roughness is not everywhere, it is aimed at the face. The aging man is constructed from visible material, so you see both a person and the physical stuff of his making at once.", "spanInContext": [452, 466]}]}, {"file": "2_Baroque_Philosophy.md", "words": 1603, "findings": [{"id": "2_Baroque_Philosophy.md:52:R8-second-person:4", "rule": "R8/R31", "name": "Second person outside instructional context", "tier": "high", "layer": "B", "section": "Looking Back, Looking Forward", "line": 52, "flagged": "your", "context": "**Toward the Enlightenment:** The Enlightenment will attempt to resolve the Baroque's tensions by doubling down on reason. Where Pascal said the heart has its reasons that reason cannot know, Kant will say: dare to use your own understanding. Where Hobbes demanded submission to absolute authority, Locke will argue for government by consent and natural rights. Where the Baroque found grandeur and terror in the new science, the Enlightenment will see progress and the promise of a better world. The emotional temperature drops; the drawing room replaces the battlefield. Yet the questions the Baroque raised — about the sufficiency of reason, about whether freedom inevitably leads to flourishing or to ruin — never wholly find resolution in the Age of Reason.", "spanInContext": [219, 223]}, {"id": "2_Baroque_Philosophy.md:8:is-real:0", "rule": "—", "name": "“Is real … and / not”", "tier": "medium", "layer": "A", "section": "Introduction", "line": 8, "flagged": "is real but dangerous, knowledge is powerful but insufficient, and", "context": "The thinkers in this unit are all, in different ways, responding to this atmosphere of grandeur and crisis. They share an awareness that the stakes are enormous. The questions being asked are not academic but existential, with consequences measured in wars, executions, and the reorientation of humanity's place in the universe. This is the intellectual world in which Milton writes *Paradise Lost*: a world where freedom is real but dangerous, knowledge is powerful but insufficient, and the relationship between the individual and authority has become a matter of life and death.", "spanInContext": [422, 488]}, {"id": "2_Baroque_Philosophy.md:46:stacked-questions:1", "rule": "R35", "name": "Stacked rhetorical questions", "tier": "medium", "layer": "A", "section": "The Individual and Authority", "line": 46, "flagged": "The poem dramatizes a series of challenging questions: what does legitimate authority look like? What does genuine obedience look like? What happens when free beings make the wrong choice?", "context": "**Connection to *Paradise Lost*:** Satan rebels against divine authority and thrillingly frames his rebellion as a fight for freedom:                                                 Yet Milton makes clear that Satan's version of freedom is self-deception: his \"liberty\" leads only to enslavement to his own rage and pride. Adam and Eve, by contrast, are genuinely free within a structure of stern, yet loving authority, until they choose to break it. The poem dramatizes a series of challenging questions: what does legitimate authority look like? What does genuine obedience look like? What happens when free beings make the wrong choice?", "spanInContext": [451, 639]}, {"id": "2_Baroque_Philosophy.md:52:sentence-anaphora:2", "rule": "R20", "name": "Repeated sentence openers", "tier": "medium", "layer": "A", "section": "Looking Back, Looking Forward", "line": 52, "flagged": "Where Pascal said the heart has its reasons that reason cannot know, Kant will say: dare to use your own understanding. Where Hobbes demanded submission to absolute authority, Locke will argue for government by consent and natural rights. Where the Baroque found grandeur and terror in the new science, the Enlightenment will see progress and the promise of a better world.", "context": "**Toward the Enlightenment:** The Enlightenment will attempt to resolve the Baroque's tensions by doubling down on reason. Where Pascal said the heart has its reasons that reason cannot know, Kant will say: dare to use your own understanding. Where Hobbes demanded submission to absolute authority, Locke will argue for government by consent and natural rights. Where the Baroque found grandeur and terror in the new science, the Enlightenment will see progress and the promise of a better world. The emotional temperature drops; the drawing room replaces the battlefield. Yet the questions the Baroque raised — about the sufficiency of reason, about whether freedom inevitably leads to flourishing or to ruin — never wholly find resolution in the Age of Reason.", "spanInContext": [123, 496]}, {"id": "2_Baroque_Philosophy.md:16:stranded-auxiliary:3", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "The Human Position", "line": 16, "flagged": ", and thought is what reveals to us how small we are.", "context": "This is not despair — or not only despair. Pascal's other great insight is that our very awareness of our wretchedness is what makes us great:                                                                                  Our dignity consists entirely in thought, and thought is what reveals to us how small we are. This is a distinctly Baroque paradox: grandeur and misery are not opposites but two faces of the same condition.", "spanInContext": [264, 317]}, {"id": "2_Baroque_Philosophy.md:42:R18-weak-ending:5", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "The Individual and Authority", "line": 42, "flagged": "depends on the idea that freedom is not a problem to be solved but the precondition of meaningful moral existence", "context": "Milton is Hobbes's great antagonist on this question. *Paradise Lost* can easily be read as a sustained refutation of the Hobbesian worldview. Milton had served in the Commonwealth that executed the king. He believed that political authority must be earned, not merely imposed; for him, obedience is only meaningful when it is freely given. Milton’s God is initially callous when confronting the inevitable suffering of Adam after the Fall (                                                                                                                       ), yet he also articulates a powerful justification for the necessity of free will:                                                                                                     The entire architecture of *Paradise Lost* depends on the idea that freedom is not a problem to be solved but the precondition of meaningful moral existence.", "spanInContext": [787, 900]}, {"id": "2_Baroque_Philosophy.md:42:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "The Individual and Authority", "line": 42, "flagged": "is freely given", "context": "Milton is Hobbes's great antagonist on this question. *Paradise Lost* can easily be read as a sustained refutation of the Hobbesian worldview. Milton had served in the Commonwealth that executed the king. He believed that political authority must be earned, not merely imposed; for him, obedience is only meaningful when it is freely given. Milton’s God is initially callous when confronting the inevitable suffering of Adam after the Fall (                                                                                                                       ), yet he also articulates a powerful justification for the necessity of free will:                                                                                                     The entire architecture of *Paradise Lost* depends on the idea that freedom is not a problem to be solved but the precondition of meaningful moral existence.", "spanInContext": [324, 339]}]}, {"file": "2_Baroque_Sculpture.md", "words": 1882, "findings": [{"id": "2_Baroque_Sculpture.md:40:not-just:1", "rule": "R7/R26", "name": "“Not just X, but Y”", "tier": "high", "layer": "A", "section": "Space & Setting", "line": 40, "flagged": "not just a carved group but", "context": "Bernini understood that a sculpture's environment is part of its meaning. The *Ecstasy of Saint Teresa* is not just a carved group but an entire chapel installation: the marble figures of Teresa and the angel are suspended in a gilded light-shaft above an altar, flanked by side walls carved with box seats from which marble portrait figures of the Cornaro family watch the ecstasy as if from theater balconies. Real light enters from a hidden window above and strikes gilded rays behind the figures.", "spanInContext": [107, 134]}, {"id": "2_Baroque_Sculpture.md:64:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Hero — Apollo and Daphne, Bernini, 1625 *(revise", "line": 64, "flagged": "no stable front and no preferred view", "context": "**Analysis:** Bernini was a prodigy, carving at a master's level in his teens, and this group — made for Cardinal Borghese while he was still in his mid-twenties — announced a technical command no one had seen before. Begin with the surfaces: bark growing up Daphne's thighs, her toes rooting into the stone beneath her feet, her fingers branching into actual leaves, all cut from a single block. Watch where Apollo's hand presses into her thigh and the flesh appears to give. Then step around it. There is no stable front and no preferred view; the group was designed to be walked around, and every angle produces a different dramatic moment. The whole thing sizzles with movement.", "spanInContext": [507, 544]}, {"id": "2_Baroque_Sculpture.md:38:R18-weak-ending:2", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Space & Setting", "line": 38, "flagged": "and how does placement shape meaning", "context": "*Where does the sculpture live, and how does placement shape meaning?*", "spanInContext": [32, 68]}, {"id": "2_Baroque_Sculpture.md:81:R18-weak-ending:3", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Gallery — David, Bernini, 1624", "line": 81, "flagged": "Bernini sculpts the violent middle of the act itself", "context": "**Prompt:** Donatello sculpts the aftermath, Michelangelo the decision — Bernini sculpts the violent middle of the act itself.", "spanInContext": [73, 125]}, {"id": "2_Baroque_Sculpture.md:18:R17-passive:4", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Body & Volume", "line": 18, "flagged": "is shown", "context": "This \"action shot\" of David in motion is the Baroque's defining sculptural statement. The body is not a stable form to be admired but a site of dynamic movement. The same principle depicts Daphne's fingers already becoming leaves, her bark rising, her mouth open in a cry that is also the beginning of silence. Puget's *Milo of Croton* pushes this logic to its extreme: the Greek athlete who tried to split an oak with his bare hands and was trapped when the tree closed around him is shown at the moment of maximum muscular effort that is also maximum helplessness. These are bodies overwhelmed — by transformation, by nature's indifference, by forces they cannot master.", "spanInContext": [482, 490]}, {"id": "2_Baroque_Sculpture.md:28:R17-passive:5", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Material & Making", "line": 28, "flagged": "be made", "context": "The Baroque sculptor's material is almost always marble — and the Baroque's central ambition is to make marble deny its own solid nature. Marble's capacity for a luminous surface finish — impossible in the porous limestone of medieval cathedrals — is what makes this ambition achievable: polished to the right degree, it can be made to suggest warmth, translucency, even the give of flesh. Bernini exploits this to its limit. His ability to render Daphne's bark-becoming skin, her hair lifting in a wind as it transforms into blown leaves, her terrified flesh still somehow warm beneath the transformation is a claim about what art can do: the sculptor's intelligence and hand can extract from cold stone something more convincingly alive, matter made to transcend its own nature.", "spanInContext": [325, 332]}, {"id": "2_Baroque_Sculpture.md:64:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Hero — Apollo and Daphne, Bernini, 1625 *(revise", "line": 64, "flagged": "was designed", "context": "**Analysis:** Bernini was a prodigy, carving at a master's level in his teens, and this group — made for Cardinal Borghese while he was still in his mid-twenties — announced a technical command no one had seen before. Begin with the surfaces: bark growing up Daphne's thighs, her toes rooting into the stone beneath her feet, her fingers branching into actual leaves, all cut from a single block. Watch where Apollo's hand presses into her thigh and the flesh appears to give. Then step around it. There is no stable front and no preferred view; the group was designed to be walked around, and every angle produces a different dramatic moment. The whole thing sizzles with movement.", "spanInContext": [556, 568]}]}, {"file": "3_Enlightenment_Music.md", "words": 1286, "findings": [{"id": "3_Enlightenment_Music.md:4:ai-vocab:0", "rule": "R34", "name": "AI vocabulary words", "tier": "high", "layer": "A", "section": "Introduction", "line": 4, "flagged": "intricate", "context": "The Classical movement in music values the same qualities that Austen values in prose: clarity, proportion, balance, wit, and the elegant management of feeling within rational structures. Behind this shift is an Enlightenment conviction: the best music is that which appeals to the greatest number. Where Baroque music was elaborate, intricate, and designed for connoisseurs, Classical music deliberately strips back to clean lines and transparent textures, music that sounds *natural* to the ear of Enlightenment listeners. The dominant form is the sonata, which organizes musical ideas into a balanced, almost architectural structure — statement, development, recapitulation — much as an Austen novel moves through introduction, complication, and resolution with exquisite formal control.", "spanInContext": [334, 343]}]}, {"file": "3_Enlightenment_Painting.md", "words": 2485, "findings": [{"id": "3_Enlightenment_Painting.md:38:R2-hedging:4", "rule": "R2", "name": "Hedging qualification", "tier": "high", "layer": "B", "section": "Connection to *Pride and Prejudice*", "line": 38, "flagged": "a kind of", "context": "Austen's narration illuminates evenly and pleasantly, allowing the reader to see every social interaction with perfect clarity. There are no dark corners in it, no Baroque obscurities or Romantic storms. Yet beneath the bright, even surface, shadows operate differently: they take the form of irony. When Austen writes,                                                                                                                         the sentence is sharply formed and perfectly legible, yet the meaning underneath — the mercenary social logic, the mothers' calculations, the gap between \"truth\" and convention — is a kind of shadow visible only to the attentive reader. This is the period's version of chiaroscuro: not dramatic darkness, but ironic depth beneath a polished surface.", "spanInContext": [622, 631]}, {"id": "3_Enlightenment_Painting.md:38:no-chain:0", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Connection to *Pride and Prejudice*", "line": 38, "flagged": "no dark corners in it, no Baroque obscurities or Romantic storms", "context": "Austen's narration illuminates evenly and pleasantly, allowing the reader to see every social interaction with perfect clarity. There are no dark corners in it, no Baroque obscurities or Romantic storms. Yet beneath the bright, even surface, shadows operate differently: they take the form of irony. When Austen writes,                                                                                                                         the sentence is sharply formed and perfectly legible, yet the meaning underneath — the mercenary social logic, the mothers' calculations, the gap between \"truth\" and convention — is a kind of shadow visible only to the attentive reader. This is the period's version of chiaroscuro: not dramatic darkness, but ironic depth beneath a polished surface.", "spanInContext": [138, 202]}, {"id": "3_Enlightenment_Painting.md:111:no-chain:1", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Gallery — Young Girl Reading, Jean-Honoré Fragon", "line": 111, "flagged": "no dramatic beam and no plunging shadow", "context": "### Gallery — Young Girl Reading, Jean-Honoré Fragonard, 1770\nSoft, even light falls across the girl, her lemon-yellow dress, and the cushion behind her, with no dramatic beam and no plunging shadow. Illumination here is not theological but decorative — it makes silk, skin, and ribbon uniformly lovely. The quiet, self-possessed absorption of a young woman reading in private is exactly the kind of ordinary social moment the Rococo, and Austen, take as their true subject.", "spanInContext": [159, 198]}, {"id": "3_Enlightenment_Painting.md:113:no-chain:2", "rule": "R1/R26", "name": "“No X, no Y” chains", "tier": "medium", "layer": "A", "section": "Gallery — Young Girl Reading, Jean-Honoré Fragon", "line": 113, "flagged": "No beam, no darkness", "context": "**Prompt:** No beam, no darkness — just flattering, even light. Notice how the mood becomes intimate rather than cosmic.", "spanInContext": [12, 32]}, {"id": "3_Enlightenment_Painting.md:50:stranded-auxiliary:3", "rule": "R18", "name": "Stranded auxiliary contrast", "tier": "medium", "layer": "A", "section": "Connection to *Pride and Prejudice*", "line": 50, "flagged": ", and Austen uses the same vocabulary the painters do.", "context": "Effortlessness is a technical problem in painting and a social one in the novel, and Austen uses the same vocabulary the painters do. \"Accomplishment\" is one of the most loaded words in *Pride and Prejudice* — Miss Bingley recites the required list, and Darcy raises the bar by adding the improvement of the mind through extensive reading. What the word really measures is whether the effort shows. Mary Bennet practices hardest and performs worst, because her labour is audible in every bar. Elizabeth plays, by her own account, not capitally, and is a pleasure to listen to. The novel is merciless about the difference between an accomplishment displayed and an accomplishment possessed, and it is the same distinction a viewer makes standing between a Boucher and a Gainsborough.", "spanInContext": [79, 133]}, {"id": "3_Enlightenment_Painting.md:42:R18-weak-ending:5", "rule": "R18", "name": "Paragraph ends on a weak word", "tier": "medium", "layer": "B", "section": "Brushwork & Surface", "line": 42, "flagged": "What is the physical character of the paint itself", "context": "*What is the physical character of the paint itself?*", "spanInContext": [1, 51]}, {"id": "3_Enlightenment_Painting.md:14:R17-passive:6", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Figure & Space", "line": 14, "flagged": "is arranged", "context": "Figures now inhabit intimate, ornate interiors or idealized garden settings. The vast, dark spaces of the Baroque give way to bright, enclosed, intimate spaces, rooms where people perform the roles assigned to them by their position in the social hierarchy. Compositions are playful, sometimes asymmetrical, with curving lines and delicate ornamentation. The human figure is no longer emerging from cosmic darkness or standing in a rationally ordered piazza; it is arranged in a social tableau, defined by its relationships with other figures.", "spanInContext": [462, 473]}, {"id": "3_Enlightenment_Painting.md:20:R17-passive:7", "rule": "R17", "name": "Passive construction", "tier": "medium", "layer": "B", "section": "Figure & Space", "line": 20, "flagged": "be understood", "context": "Neoclassicism rearranges the same elements toward the opposite purpose. Kauffman's *Cornelia* sets its figures on a shallow stage, parallel to the picture plane and spaced so that every gesture is legible — a frieze rather than a garden. Nothing is glimpsed, nothing is half-hidden, and nothing d
